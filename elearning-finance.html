<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Colleo — Finance for physios</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
 --navy:#1e2d4a;--accent:#3ecfb2;--accent-ink:#0f5e50;
 --bg:#f7f3ec;--bg-2:#efe9df;--surface:#fff;--ink:#1b2436;--muted:#5b6577;
 --warn:#7a4a00;--warn-bg:#fdf0d8;--bad:#b04a4a;
 --hairline:rgba(30,45,74,.12);--hairline-soft:rgba(30,45,74,.07);
 --font-display:"Bricolage Grotesque",Georgia,serif;--font-body:"Hanken Grotesk",system-ui,sans-serif;
 --r-card:22px;--r-sm:12px;--r-pill:999px;
 --shadow-sm:0 1px 2px rgba(27,36,54,.04),0 2px 8px rgba(27,36,54,.05);
 --shadow-md:0 12px 30px -12px rgba(27,36,54,.22);
 --shadow-lg:0 30px 70px -30px rgba(27,36,54,.40);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
p{margin:0;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:var(--r-pill);padding:13px 22px;font-size:1rem;font-weight:600;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-md)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-accent{background:var(--accent);color:var(--navy);box-shadow:var(--shadow-md)}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--hairline)}
.btn-ghost:hover{border-color:var(--navy)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline-soft)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 clamp(16px,4vw,28px);gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--navy);letter-spacing:-.03em;text-decoration:none}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:var(--accent);font-size:1rem}
.brand .sub{font-family:var(--font-body);font-weight:500;font-size:.74rem;color:var(--muted);letter-spacing:0}
.top-r{display:flex;align-items:center;gap:14px}
.stepcount{font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.stepcount b{color:var(--navy)}
.menu-btn{border:1.5px solid var(--hairline);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--navy)}
.prog{height:4px;background:var(--bg-2);position:sticky;top:64px;z-index:49}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--navy)));transition:width .4s ease}

/* outline drawer */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(27,36,54,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);background:var(--surface);box-shadow:var(--shadow-lg);padding:22px;overflow:auto}
.drawer h3{font-size:1.2rem}
.ol-part{margin-top:18px}
.ol-part .pt{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ol-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:7px 8px;border-radius:9px;color:var(--ink);font-size:.93rem}
.ol-item:hover{background:var(--bg)}
.ol-item.cur{background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:600}
.ol-item .oi{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg-2);color:var(--muted)}
.ol-item.seen .oi{background:var(--accent);color:var(--navy)}

/* main */
.main{max-width:760px;margin:0 auto;width:100%;padding:clamp(26px,5vw,52px) clamp(16px,4vw,28px) 140px}
.pane.in{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane h1{font-size:clamp(2rem,5vw,3rem);margin-top:14px}
.pane h2{font-size:clamp(1.7rem,3.6vw,2.4rem);margin-top:14px}
.lede{font-size:1.12rem;color:var(--muted);margin-top:16px}
.body{margin-top:22px}
.body p+p{margin-top:14px}
.body>p{color:var(--ink)}

/* components */
.card{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-card);box-shadow:var(--shadow-sm);padding:clamp(20px,3vw,28px);margin-top:22px}
.callout{display:flex;gap:14px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:16px;padding:17px 19px;margin-top:22px}
.callout .cic{width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface);color:var(--accent-ink);display:grid;place-items:center}
.callout .ct{font-weight:700;color:var(--navy)}
.callout .cs{color:var(--ink);font-size:.97rem;margin-top:2px}
.callout.warn{background:var(--warn-bg)}
.callout.warn .cic{color:var(--warn)}
.factcard{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:26px 28px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;margin-top:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.factcard::after{content:"";position:absolute;inset:auto -40px -55px auto;width:190px;height:190px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 50%,transparent),transparent 70%)}
.factcard .big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1;color:var(--accent);position:relative}
.factcard .ft{position:relative;flex:1;min-width:200px;color:color-mix(in srgb,#fff 88%,transparent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--navy);border-radius:18px;padding:20px;color:#fff;position:relative;overflow:hidden}
.stat .big{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.05;color:var(--accent)}
.stat .st{font-size:.92rem;margin-top:8px;color:color-mix(in srgb,#fff 82%,transparent)}
.checks{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow-sm)}
.checks .ck{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent-ink);display:grid;place-items:center}
.vsteps{display:flex;flex-direction:column;margin-top:22px}
.vstep{position:relative;display:grid;grid-template-columns:46px 1fr;gap:18px;padding-bottom:22px;align-items:start}
.vstep:last-child{padding-bottom:0}
.vstep .n{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1.5px solid var(--hairline);color:var(--navy);font-family:var(--font-display);font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow-sm);z-index:1}
.vstep:not(:last-child)::before{content:"";position:absolute;left:22.5px;top:46px;bottom:2px;width:1.5px;background:var(--hairline)}
.vstep h4{font-size:1.1rem;margin-top:10px}
.vstep p{color:var(--ink);margin-top:11px}
.vstep h4+p{color:var(--muted);margin-top:4px;font-size:.97rem}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.col{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.col h4{font-size:1.08rem;display:flex;align-items:center;gap:9px}
.col .dotc{width:11px;height:11px;border-radius:50%;flex:none;background:var(--accent)}
.col.alt .dotc{background:#d98b8b}
.col ul{margin:10px 0 0;padding-left:18px;font-size:.96rem}
.col li+li{margin-top:5px}
.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.tcard{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--accent)}
.tcard:nth-child(2){border-top-color:#f2b84b}.tcard:nth-child(3){border-top-color:#d98b8b}
.tcard h4{font-size:1.1rem}
.tcard .s{font-size:.85rem;color:var(--muted);margin-top:2px}
.tcard ul{margin:10px 0 0;padding-left:18px;font-size:.94rem}
.tablewrap{margin-top:22px;overflow-x:auto;border-radius:18px;border:1px solid var(--hairline-soft);box-shadow:var(--shadow-sm);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.96rem}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--hairline-soft);vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px}
.pyr div{color:#fff;text-align:center;padding:11px 14px;border-radius:10px;font-size:.92rem;font-weight:600;box-shadow:var(--shadow-sm)}
.pyr-ax{font-size:.82rem;color:var(--muted);margin-top:8px}
.video{margin-top:22px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--navy);box-shadow:var(--shadow-md)}
.video iframe{width:100%;height:100%;border:0;display:block}
.video.empty{display:grid;place-items:center;text-align:center;color:color-mix(in srgb,#fff 78%,transparent);padding:20px}
.video.empty p{margin-top:10px}
.howbox{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:24px 26px;margin-top:26px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.howbox::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%)}
.howbox h3{color:#fff;font-size:1.2rem;position:relative}
.howbox p{color:color-mix(in srgb,#fff 82%,transparent);margin-top:6px;position:relative}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.meta span{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;color:var(--navy)}
.small{font-size:.88rem;color:var(--muted);margin-top:18px}

/* quiz */
.qnum{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--hairline);border-radius:12px;transition:border-color .14s,background .14s;background:var(--surface);text-align:left;font-size:1rem;color:var(--ink);width:100%}
.opt:hover{border-color:var(--accent)}
.opt .mk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--hairline);flex:none;display:grid;place-items:center;color:transparent;font-size:.8rem;font-weight:700}
.opt.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.correct .mk{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.opt.wrong{border-color:#d98b8b;background:color-mix(in srgb,#d98b8b 12%,var(--surface))}
.opt.wrong .mk{border-color:#d98b8b;color:var(--bad)}
.opt.sel{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 6%,var(--surface))}
.opt.sel .mk{background:var(--navy);border-color:var(--navy);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--bg-2);font-size:.98rem}
.explain.good{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent-ink)}
.explain.bad{background:#fbeaea;color:#8a1f1f}
.tq{margin-top:20px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.tq h4{font-size:1.08rem;margin-top:4px}
.tq .opts{margin-top:14px}
.tq.ok{border-color:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.tq.nok{border-color:#e6b0aa}
.tq .fb{margin-top:10px;font-size:.92rem;font-weight:600}
.tq.ok .fb{color:var(--accent-ink)}.tq.nok .fb{color:var(--bad)}
.tsubmit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.92rem}
.result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px;border-radius:18px;padding:20px 22px}
.result .big{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1}
.result>div:nth-child(2){flex:1;min-width:200px}
.result.pass{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent-ink)}
.result.fail{background:#fdecec;color:#8a1f1f}
.lock{display:flex;gap:16px;align-items:flex-start;margin-top:22px}
.cert{margin-top:26px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-card);box-shadow:var(--shadow-md);padding:28px;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--navy))}
.cert .seal{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--accent);display:grid;place-items:center;margin:4px auto 0}
.cert h3{margin-top:12px;font-size:1.4rem}
.cert .cm{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cert .cm span{background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--navy)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--hairline-soft)}
.nav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(16px,4vw,28px)}
.dots{display:flex;gap:7px;align-items:center;min-width:0}
.dotp{width:9px;height:9px;border-radius:50%;background:var(--hairline);border:none;padding:0;transition:all .2s}
.dotp.done{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.dotp.cur{background:var(--accent);width:22px;border-radius:99px}
@media (max-width:640px){
 .twocol,.threecol{grid-template-columns:1fr}
 .brand .sub{display:none}
}
@media (max-width:480px){
 .nav-in{gap:8px;padding:12px}
 .nav-in .btn{padding-left:14px;padding-right:14px}
 .dots{gap:5px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="elearnings.html" title="Terug naar alle e-learnings"><span class="dot">C</span>Colleo <span class="sub">e-learning</span></a>
    <div class="top-r">
      <span class="stepcount" id="count"></span>
      <button class="menu-btn" id="menuBtn" aria-label="Overzicht van de module"></button>
    </div>
  </div>
</header>
<div class="prog"><i id="bar"></i></div>
<div class="drawer" id="drawer"><div class="scrim" data-close></div><aside class="panel" aria-label="Overzicht"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Overzicht</h3><button class="menu-btn" data-close aria-label="Sluiten">✕</button></div><div id="outline"></div></aside></div>
<main class="main"><section class="pane" id="pane" aria-live="polite"></section></main>
<nav class="nav"><div class="nav-in">
  <button class="btn btn-ghost" id="prev"></button>
  <div class="dots" id="dots"></div>
  <button class="btn btn-primary" id="next"></button>
</div></nav>

    const part = st.type === 'toets' ? 'toets' : 'b' + st.blok;
    const eb = st.blok ? 'Blok ' + st.blok + ' · ' + blocks[st.blok] : '';
    if (st.type === 'video') S.push({ t: 'video', part: part, step: st, eyebrow: eb + ' · Kijken', title: st.titel.replace(/^Blok \d+ · /, '') });
    if (st.type === 'lezen') st.kaarten.forEach(function (k) { S.push({ t: 'card', part: part, card: k, eyebrow: eb, title: k.h }); });
    if (st.type === 'check') st.vragen.forEach(function (v, qi) { S.push({ t: 'q', part: part, v: v, id: si + '_' + qi, n: qi + 1, of: st.vragen.length, eyebrow: eb + ' · Kennisvraag', title: v.q }); });
    if (st.type === 'toets') S.push({ t: 'toets', part: 'toets', step: st, eyebrow: 'Afsluiten', title: 'Eindtoets' });
  });
  S.push({ t: 'end', part: 'toets', eyebrow: 'Afsluiten', title: 'Afronding' });

  // ── state ──
  const KEY = 'colleo_mod2_' + M.id;
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  let st = load(); st.seen = st.seen || {}; st.ans = st.ans || {};
  let cur = Math.min(st.cur || 0, S.length - 1);

  const pane = document.getElementById('pane'), prev = document.getElementById('prev'), next = document.getElementById('next');
  prev.innerHTML = icon('arrowL', 18) + ' Vorige';
  document.getElementById('menuBtn').innerHTML = icon('menu', 18);

  function partIndex(k) { return parts.findIndex(function (p) { return p.key === k; }); }
  function chrome() {
    document.getElementById('count').innerHTML = 'Stap <b>' + (cur + 1) + '</b> / ' + S.length;
    document.getElementById('bar').style.width = Math.round(cur / (S.length - 1) * 100) + '%';
    const pi = partIndex(S[cur].part);
    document.getElementById('dots').innerHTML = parts.map(function (p, i) {
      return '<button class="dotp' + (i === pi ? ' cur' : (i < pi ? ' done' : '')) + '" data-p="' + p.key + '" title="' + esc(p.label) + '" aria-label="' + esc(p.label) + '"></button>';
    }).join('');
    document.querySelectorAll('.dotp').forEach(function (d) { d.addEventListener('click', function () { go(S.findIndex(function (s) { return s.part === d.dataset.p; })); }); });
    prev.disabled = cur === 0;
    let o = '';
    parts.forEach(function (p) {
      o += '<div class="ol-part"><div class="pt">' + esc(p.label) + '</div>';
      S.forEach(function (s, i) { if (s.part === p.key) o += '<button class="ol-item' + (i === cur ? ' cur' : '') + (st.seen[i] ? ' seen' : '') + '" data-i="' + i + '"><span class="oi">' + (st.seen[i] ? icon('check', 13) : '') + '</span>' + esc(s.title) + '</button>'; });
      o += '</div>';
    });
    document.getElementById('outline').innerHTML = o;
    document.querySelectorAll('.ol-item').forEach(function (b) { b.addEventListener('click', function () { closeDrawer(); go(+b.dataset.i); }); });
  }
  function setNext(label, enabled) { next.innerHTML = label + ' ' + icon('arrow', 18); next.disabled = !enabled; next.style.visibility = cur === S.length - 1 ? 'hidden' : 'visible'; }
  function go(i) { if (i < 0 || i >= S.length) return; st.seen[cur] = true; cur = i; st.cur = cur; save(); render(); scrollTo({ top: 0, behavior: 'smooth' }); }
  prev.addEventListener('click', function () { go(cur - 1); });
  next.addEventListener('click', function () { go(cur + 1); });
  const drawer = document.getElementById('drawer');
  function closeDrawer() { drawer.classList.remove('open'); }
  document.getElementById('menuBtn').addEventListener('click', function () { drawer.classList.add('open'); });
  drawer.querySelectorAll('[data-close]').forEach(function (e) { e.addEventListener('click', closeDrawer); });
  addEventListener('keydown', function (e) { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' && !next.disabled) go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'Escape') closeDrawer(); });

  function head(s, h1) { return (s.eyebrow ? '<span class="eyebrow">' + esc(s.eyebrow) + '</span>' : '') + (h1 ? '<h1>' : '<h2>') + esc(s.title) + (h1 ? '</h1>' : '</h2>'); }

  function cardBody(k) {
    let h = '';
    if (k.p) h += '<div class="body">' + k.p.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    if (k.stat) h += '<div class="factcard"><div class="big">' + esc(k.stat.big) + '</div><div class="ft">' + esc(k.stat.txt) + '</div></div>';
    if (k.stats) h += '<div class="stats">' + k.stats.map(function (x) { return '<div class="stat"><div class="big">' + esc(x.big) + '</div><div class="st">' + esc(x.txt) + '</div></div>'; }).join('') + '</div>';
    if (k.lijst) h += '<ul class="checks">' + k.lijst.map(function (l) { return '<li><span class="ck">' + icon('check', 15) + '</span><span>' + esc(l) + '</span></li>'; }).join('') + '</ul>';
    if (k.genummerd) h += '<div class="vsteps">' + k.genummerd.map(function (l, i) { return '<div class="vstep"><div class="n">' + (i + 1) + '</div><p>' + esc(l) + '</p></div>'; }).join('') + '</div>';
    if (k.twee) h += '<div class="twocol">' + k.twee.map(function (c, i) { return '<div class="col' + (i ? ' alt' : '') + '"><h4><span class="dotc"></span>' + esc(c.k) + '</h4><ul>' + c.l.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div>';
    if (k.drie) h += '<div class="threecol">' + k.drie.map(function (c) { return '<div class="tcard"><h4>' + esc(c.k) + '</h4><div class="s">' + esc(c.s) + '</div><ul>' + c.l.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div>';
    if (k.tabel) h += '<div class="tablewrap"><table><thead><tr>' + k.tabel.kop.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + k.tabel.rijen.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    if (k.piramide) {
      const cols = ['#7a2e3a', '#8a5a1a', '#1e2d4a', '#2f5d7a', '#0f5e50'], n = k.piramide.length;
      h += '<div class="pyr">' + k.piramide.map(function (l, i) { return '<div style="width:' + (44 + i * (56 / (n - 1))) + '%;background:' + cols[i % 5] + '">' + esc(l) + '</div>'; }).join('') + '<div class="pyr-ax">▲ meer risico en meer verwacht rendement</div></div>';
    }
    if (k.tip) h += '<div class="callout' + (k.let ? ' warn' : '') + '"><div class="cic">' + icon(k.let ? 'alert' : 'bulb', 20) + '</div><div><div class="ct">' + (k.let ? 'Let op' : 'Onthoud') + '</div><div class="cs">' + esc(k.tip) + '</div></div></div>';
    else if (k.let) h += '<div class="callout warn"><div class="cic">' + icon('alert', 20) + '</div><div><div class="ct">Let op</div><div class="cs">Algemene informatie, geen persoonlijk advies.</div></div></div>';
    return h;
  }

  function videoHtml(v) {
    if (!v.youtube) return '<div class="video empty"><div>' + icon('play', 40) + '<p>De video van dit blok wordt binnenkort toegevoegd.</p></div></div>';
    const q = ['rel=0', 'modestbranding=1']; if (v.start) q.push('start=' + v.start); if (v.end) q.push('end=' + v.end);
    return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.youtube) + '?' + q.join('&') + '" title="' + esc(v.titel) + '" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
  }

  function render() {
    const s = S[cur];
    pane.classList.remove('in'); void pane.offsetWidth; pane.classList.add('in');
    chrome();
    if (s.t === 'intro') {
      const blist = Object.keys(blocks).map(function (b, i) { return '<div class="vstep"><div class="n">' + (i + 1) + '</div><div><h4>' + esc(blocks[b]) + '</h4>' + (META.blokinfo && META.blokinfo[i] ? '<p>' + esc(META.blokinfo[i]) + '</p>' : '') + '</div></div>'; }).join('');
      pane.innerHTML = '<span class="eyebrow">E-learning · Bijscholing kinesitherapie</span><h1>' + esc(META.titel) + '</h1><p class="lede">' + esc(META.lede) + '</p>' +
        '<div class="meta"><span>' + icon('clock', 16) + ' ' + esc(META.duur) + '</span><span>' + icon('medal', 16) + ' ' + esc(META.punten) + '</span><span>' + icon('list', 16) + ' Eindtoets, slagen vanaf 70%</span></div>' +
        '<div class="howbox"><h3>Zo werkt deze module</h3><p>Per blok kijk je eerst een stuk van de opgenomen sessie. Daarna klik je door de kern op papier en beantwoord je een paar kennisvragen. Je sluit af met een eindtoets. Je voortgang wordt in deze browser bewaard, dus je kan altijd pauzeren.</p></div>' +
        '<div class="vsteps" style="margin-top:28px">' + blist + '<div class="vstep"><div class="n">' + icon('medal', 20) + '</div><div><h4>Eindtoets</h4><p>10 vragen, je slaagt vanaf 70%.</p></div></div></div>' +
        '<p class="small">Klik op <b>Volgende</b> om te starten. Via het menu rechtsboven spring je naar elk onderdeel.</p>';
      setNext(cur === 0 && !st.seen[0] ? 'Start' : 'Volgende', true);
    } else if (s.t === 'doelen') {
      pane.innerHTML = '<span class="eyebrow">Vooraf</span><h2>Wat je na deze module kan</h2><p class="lede">Lees de leerdoelen even door. Ze geven richting aan wat volgt.</p>' +
        '<div class="vsteps">' + META.doelen.map(function (d) { return '<div class="vstep"><div class="n">' + icon('target', 20) + '</div><p>' + esc(d) + '</p></div>'; }).join('') + '</div>';
      setNext('Volgende', true);
    } else if (s.t === 'card') {
      pane.innerHTML = head(s) + cardBody(s.card);
      setNext('Volgende', true);
    } else if (s.t === 'video') {
      pane.innerHTML = head(s) + '<p class="lede">' + esc(s.step.intro) + '</p>' + videoHtml(s.step) +
        '<div class="callout"><div class="cic">' + icon('bulb', 20) + '</div><div><div class="ct">Tip</div><div class="cs">Kijk de video volledig. Daarna vind je de kern van dit blok op papier, gevolgd door een paar kennisvragen.</div></div></div>';
      setNext('Ik heb dit bekeken', true);
    } else if (s.t === 'q') renderQ(s);
    else if (s.t === 'toets') renderToets(s);
    else renderEnd(s);
  }

  function renderQ(s) {
    const v = s.v, prevA = st.ans[s.id];
    pane.innerHTML = head(s) + '<div class="qnum">Vraag ' + s.n + ' van ' + s.of + '</div>' +
      '<div class="opts">' + v.a.map(function (a, i) { return '<button class="opt" data-i="' + i + '"><span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + esc(a) + '</span></button>'; }).join('') + '</div><div id="ex"></div>';
    const opts = pane.querySelectorAll('.opt');
    function show(i) {
      opts.forEach(function (o, j) { o.disabled = true; if (j === v.c) { o.classList.add('correct'); o.querySelector('.mk').innerHTML = icon('check', 14); } else if (j === i) { o.classList.add('wrong'); o.querySelector('.mk').innerHTML = icon('x', 14); } });
      const ok = i === v.c;
      document.getElementById('ex').innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Juist. ' : 'Niet helemaal. ') + '</b>' + esc(v.u || '') + '</div>';
      setNext('Volgende', true);
    }
    opts.forEach(function (o) { o.addEventListener('click', function () { const i = +o.dataset.i; st.ans[s.id] = i; save(); show(i); }); });
    if (prevA != null) show(prevA); else setNext('Volgende', false);
  }

  function renderToets(s) {
    const T = s.step, n = T.vragen.length, pass = T.slagen || 70;
    const qIdx = S.map(function (x, i) { return x.t === 'q' ? i : -1; }).filter(function (i) { return i >= 0; });
    const vIdx = S.map(function (x, i) { return x.t === 'video' ? i : -1; }).filter(function (i) { return i >= 0; });
    const todo = qIdx.filter(function (i) { return st.ans[S[i].id] == null; }).concat(vIdx.filter(function (i) { return !st.seen[i]; })).sort(function (a, b) { return a - b; });
    if (todo.length) {
      pane.innerHTML = head(s) + '<div class="card lock"><div class="cic" style="color:var(--muted)">' + icon('lock', 26) + '</div><div><h3 style="font-size:1.15rem">Nog even geduld</h3><p style="color:var(--muted);margin:6px 0 14px">Doorloop eerst alle video’s en kennisvragen. Daarna kan je de eindtoets afleggen. Nog ' + todo.length + (todo.length === 1 ? ' onderdeel' : ' onderdelen') + ' te gaan.</p><button class="btn btn-primary" id="goTodo">Ga verder waar je was ' + icon('arrow', 18) + '</button></div></div>';
      document.getElementById('goTodo').addEventListener('click', function () { go(todo[0]); });
      setNext('Volgende', false); return;
    }
    let h = head(s) + '<p class="lede">' + n + ' vragen over de hele module. Je slaagt vanaf ' + pass + '%. Pas na het indienen zie je je score.</p>';
    if (st.toets && st.toets.geslaagd) h += '<div class="result pass"><div class="big">' + st.toets.score + '%</div><div><b>Al geslaagd</b> op ' + esc(st.toets.datum) + '. Je mag de toets opnieuw maken.</div></div>';
    T.vragen.forEach(function (v, qi) {
      h += '<div class="tq" data-q="' + qi + '"><div class="qnum">Vraag ' + (qi + 1) + ' van ' + n + '</div><h4>' + esc(v.q) + '</h4><div class="opts">' +
        v.a.map(function (a, i) { return '<button class="opt" data-i="' + i + '"><span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + esc(a) + '</span></button>'; }).join('') + '</div><div class="fb"></div></div>';
    });
    h += '<div class="tsubmit"><span id="cnt">0 / ' + n + ' beantwoord</span><button class="btn btn-primary" id="send" disabled>Toets indienen ' + icon('arrow', 18) + '</button></div><div id="res"></div>';
    pane.innerHTML = h;
    setNext('Naar de afronding', !!(st.toets && st.toets.geslaagd));
    const ans = {}; let locked = false; const send = document.getElementById('send');
    pane.querySelectorAll('.tq').forEach(function (q) {
      const qi = +q.dataset.q;
      q.querySelectorAll('.opt').forEach(function (o) {
        o.addEventListener('click', function () {
          if (locked) return;
          q.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          o.classList.add('sel'); ans[qi] = +o.dataset.i;
          const k = Object.keys(ans).length; document.getElementById('cnt').textContent = k + ' / ' + n + ' beantwoord'; send.disabled = k < n;
        });
      });
    });
    send.addEventListener('click', function () {
      locked = true; send.disabled = true; let good = 0;
      pane.querySelectorAll('.tq').forEach(function (q) {
        const qi = +q.dataset.q, ok = ans[qi] === T.vragen[qi].c; if (ok) good++;
        q.classList.add(ok ? 'ok' : 'nok'); q.querySelector('.fb').textContent = ok ? 'Juist' : 'Fout';
        q.querySelectorAll('.opt').forEach(function (o) { o.disabled = true; });
      });
      const score = Math.round(good / n * 100), ok = score >= pass, res = document.getElementById('res');
      if (ok) {
        st.toets = { geslaagd: true, score: score, datum: new Date().toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' }) }; save();
        res.innerHTML = '<div class="result pass"><div class="big">' + score + '%</div><div><b>Geslaagd!</b> Je beantwoordde ' + good + ' van ' + n + ' vragen juist.</div><button class="btn btn-primary" id="toEnd">Naar de afronding ' + icon('arrow', 18) + '</button></div>';
        document.getElementById('toEnd').addEventListener('click', function () { go(cur + 1); });
        setNext('Naar de afronding', true);
      } else {
        res.innerHTML = '<div class="result fail"><div class="big">' + score + '%</div><div><b>Nog niet geslaagd.</b> ' + good + ' van ' + n + ' juist; je hebt minstens ' + pass + '% nodig. Herbekijk gerust de blokken via het menu en probeer opnieuw.</div><button class="btn btn-primary" id="retry">Opnieuw proberen</button></div>';
        document.getElementById('retry').addEventListener('click', function () { render(); scrollTo({ top: 0, behavior: 'smooth' }); });
      }
      res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  function renderEnd(s) {
    const t = st.toets;
    if (!t || !t.geslaagd) {
      pane.innerHTML = head(s) + '<p class="lede">Je bent bijna klaar. Leg eerst de eindtoets af om de module af te ronden.</p><div style="margin-top:22px"><button class="btn btn-primary" id="toToets">Naar de eindtoets ' + icon('arrow', 18) + '</button></div>';
      document.getElementById('toToets').addEventListener('click', function () { go(cur - 1); });
      setNext('Volgende', false); return;
    }
    pane.innerHTML = '<span class="eyebrow">Afsluiten</span><h1>Proficiat, je hebt de module afgerond</h1>' +
      '<div class="cert"><div class="seal">' + icon('medal', 30) + '</div><h3>' + esc(META.titel) + '</h3><p style="color:var(--muted);margin-top:6px">Geslaagd voor de eindtoets</p><div class="cm"><span>Score ' + t.score + '%</span><span>' + esc(t.datum) + '</span><span>' + esc(META.punten) + '</span></div></div>' +
      '<h3 style="margin-top:32px;font-size:1.25rem">Nog twee dingen</h3>' +
      '<div class="vsteps"><div class="vstep"><div class="n">1</div><div><h4>Voeg de navorming toe in je Pro-Q-Kine-portfolio</h4><p>Dat doe je zelf; wij hebben geen toegang tot je account. Via e-learning haal je maximaal 24 navormingseenheden per jaar.</p></div></div>' +
      '<div class="vstep"><div class="n">2</div><div><h4>Laat ons weten wat je ervan vond</h4><p>We zijn een jonge organisatie en sturen bij op basis van jullie feedback.</p></div></div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:26px"><a class="btn btn-primary" href="contact.html">Geef feedback ' + icon('arrow', 18) + '</a><a class="btn btn-ghost" href="elearnings.html">Alle e-learnings</a><button class="btn btn-ghost" id="restart">Opnieuw beginnen</button></div>';
    document.getElementById('restart').addEventListener('click', function () { st = { seen: {}, ans: {} }; save(); go(0); });
    setNext('Volgende', false);
  }

  render();
})();
</script>
</body>
</html>
