<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Colleo — Complexe pijn: begrijpen en in beweging brengen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
 --navy:#1e2d4a;--accent:#3ecfb2;--accent-ink:#0f5e50;
 --bg:#f7f3ec;--bg-2:#efe9df;--surface:#fff;--ink:#1b2436;--muted:#5b6577;
 --warn:#7a4a00;--warn-bg:#fdf0d8;--bad:#b04a4a;
 --hairline:rgba(30,45,74,.12);--hairline-soft:rgba(30,45,74,.07);
 --font-display:"Bricolage Grotesque",Georgia,serif;--font-body:"Hanken Grotesk",system-ui,sans-serif;
 --r-card:22px;--r-sm:12px;--r-pill:999px;
 --shadow-sm:0 1px 2px rgba(27,36,54,.04),0 2px 8px rgba(27,36,54,.05);
 --shadow-md:0 12px 30px -12px rgba(27,36,54,.22);
 --shadow-lg:0 30px 70px -30px rgba(27,36,54,.40);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
p{margin:0;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:var(--r-pill);padding:13px 22px;font-size:1rem;font-weight:600;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-md)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-accent{background:var(--accent);color:var(--navy);box-shadow:var(--shadow-md)}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--hairline)}
.btn-ghost:hover{border-color:var(--navy)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline-soft)}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 clamp(16px,4vw,28px);gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--navy);letter-spacing:-.03em;text-decoration:none}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:var(--accent);font-size:1rem}
.brand .sub{font-family:var(--font-body);font-weight:500;font-size:.74rem;color:var(--muted);letter-spacing:0}
.top-r{display:flex;align-items:center;gap:14px}
.stepcount{font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.stepcount b{color:var(--navy)}
.menu-btn{border:1.5px solid var(--hairline);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--navy)}
.prog{height:4px;background:var(--bg-2);position:sticky;top:64px;z-index:49}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--navy)));transition:width .4s ease}

/* outline drawer */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(27,36,54,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);background:var(--surface);box-shadow:var(--shadow-lg);padding:22px;overflow:auto}
.drawer h3{font-size:1.2rem}
.ol-part{margin-top:18px}
.ol-part .pt{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ol-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:7px 8px;border-radius:9px;color:var(--ink);font-size:.93rem}
.ol-item:hover{background:var(--bg)}
.ol-item.cur{background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:600}
.ol-item .oi{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg-2);color:var(--muted)}
.ol-item.seen .oi{background:var(--accent);color:var(--navy)}

/* main */
.main{max-width:760px;margin:0 auto;width:100%;padding:clamp(26px,5vw,52px) clamp(16px,4vw,28px) 140px}
.pane.in{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane h1{font-size:clamp(2rem,5vw,3rem);margin-top:14px}
.pane h2{font-size:clamp(1.7rem,3.6vw,2.4rem);margin-top:14px}
.lede{font-size:1.12rem;color:var(--muted);margin-top:16px}
.body{margin-top:22px}
.body p+p{margin-top:14px}
.body>p{color:var(--ink)}

/* components */
.card{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-card);box-shadow:var(--shadow-sm);padding:clamp(20px,3vw,28px);margin-top:22px}
.callout{display:flex;gap:14px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:16px;padding:17px 19px;margin-top:22px}
.callout .cic{width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface);color:var(--accent-ink);display:grid;place-items:center}
.callout .ct{font-weight:700;color:var(--navy)}
.callout .cs{color:var(--ink);font-size:.97rem;margin-top:2px}
.callout.warn{background:var(--warn-bg)}
.callout.warn .cic{color:var(--warn)}
.factcard{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:26px 28px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;margin-top:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.factcard::after{content:"";position:absolute;inset:auto -40px -55px auto;width:190px;height:190px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 50%,transparent),transparent 70%)}
.factcard .big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1;color:var(--accent);position:relative}
.factcard .ft{position:relative;flex:1;min-width:200px;color:color-mix(in srgb,#fff 88%,transparent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--navy);border-radius:18px;padding:20px;color:#fff;position:relative;overflow:hidden}
.stat .big{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.05;color:var(--accent)}
.stat .st{font-size:.92rem;margin-top:8px;color:color-mix(in srgb,#fff 82%,transparent)}
.checks{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow-sm)}
.checks .ck{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent-ink);display:grid;place-items:center}
.vsteps{display:flex;flex-direction:column;margin-top:22px}
.vstep{position:relative;display:grid;grid-template-columns:46px 1fr;gap:18px;padding-bottom:22px;align-items:start}
.vstep:last-child{padding-bottom:0}
.vstep .n{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1.5px solid var(--hairline);color:var(--navy);font-family:var(--font-display);font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow-sm);z-index:1}
.vstep:not(:last-child)::before{content:"";position:absolute;left:22.5px;top:46px;bottom:2px;width:1.5px;background:var(--hairline)}
.vstep h4{font-size:1.1rem;margin-top:10px}
.vstep p{color:var(--ink);margin-top:11px}
.vstep h4+p{color:var(--muted);margin-top:4px;font-size:.97rem}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.col{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.col h4{font-size:1.08rem;display:flex;align-items:center;gap:9px}
.col .dotc{width:11px;height:11px;border-radius:50%;flex:none;background:var(--accent)}
.col.alt .dotc{background:#d98b8b}
.col ul{margin:10px 0 0;padding-left:18px;font-size:.96rem}
.col li+li{margin-top:5px}
.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.tcard{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--accent)}
.tcard:nth-child(2){border-top-color:#f2b84b}.tcard:nth-child(3){border-top-color:#d98b8b}
.tcard h4{font-size:1.1rem}
.tcard .s{font-size:.85rem;color:var(--muted);margin-top:2px}
.tcard ul{margin:10px 0 0;padding-left:18px;font-size:.94rem}
.tablewrap{margin-top:22px;overflow-x:auto;border-radius:18px;border:1px solid var(--hairline-soft);box-shadow:var(--shadow-sm);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.96rem}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--hairline-soft);vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px}
.pyr div{color:#fff;text-align:center;padding:11px 14px;border-radius:10px;font-size:.92rem;font-weight:600;box-shadow:var(--shadow-sm)}
.pyr-ax{font-size:.82rem;color:var(--muted);margin-top:8px}
.video{margin-top:22px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--navy);box-shadow:var(--shadow-md)}
.video iframe{width:100%;height:100%;border:0;display:block}
.video.empty{display:grid;place-items:center;text-align:center;color:color-mix(in srgb,#fff 78%,transparent);padding:20px}
.video.empty p{margin-top:10px}
.howbox{background:var(--navy);color:#fff;border-radius:var(--r-card);padding:24px 26px;margin-top:26px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.howbox::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%)}
.howbox h3{color:#fff;font-size:1.2rem;position:relative}
.howbox p{color:color-mix(in srgb,#fff 82%,transparent);margin-top:6px;position:relative}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.meta span{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;color:var(--navy)}
.small{font-size:.88rem;color:var(--muted);margin-top:18px}

/* quiz */
.qnum{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--hairline);border-radius:12px;transition:border-color .14s,background .14s;background:var(--surface);text-align:left;font-size:1rem;color:var(--ink);width:100%}
.opt:hover{border-color:var(--accent)}
.opt .mk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--hairline);flex:none;display:grid;place-items:center;color:transparent;font-size:.8rem;font-weight:700}
.opt.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.correct .mk{background:var(--accent);border-color:var(--accent);color:var(--navy)}
.opt.wrong{border-color:#d98b8b;background:color-mix(in srgb,#d98b8b 12%,var(--surface))}
.opt.wrong .mk{border-color:#d98b8b;color:var(--bad)}
.opt.sel{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 6%,var(--surface))}
.opt.sel .mk{background:var(--navy);border-color:var(--navy);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--bg-2);font-size:.98rem}
.explain.good{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent-ink)}
.explain.bad{background:#fbeaea;color:#8a1f1f}
.tq{margin-top:20px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.tq h4{font-size:1.08rem;margin-top:4px}
.tq .opts{margin-top:14px}
.tq.ok{border-color:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.tq.nok{border-color:#e6b0aa}
.tq .fb{margin-top:10px;font-size:.92rem;font-weight:600}
.tq.ok .fb{color:var(--accent-ink)}.tq.nok .fb{color:var(--bad)}
.tsubmit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.92rem}
.result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px;border-radius:18px;padding:20px 22px}
.result .big{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1}
.result>div:nth-child(2){flex:1;min-width:200px}
.result.pass{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent-ink)}
.result.fail{background:#fdecec;color:#8a1f1f}
.lock{display:flex;gap:16px;align-items:flex-start;margin-top:22px}
.cert{margin-top:26px;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--r-card);box-shadow:var(--shadow-md);padding:28px;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--navy))}
.cert .seal{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--accent);display:grid;place-items:center;margin:4px auto 0}
.cert h3{margin-top:12px;font-size:1.4rem}
.cert .cm{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cert .cm span{background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--navy)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--hairline-soft)}
.nav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(16px,4vw,28px)}
.dots{display:flex;gap:7px;align-items:center;min-width:0}
.dotp{width:9px;height:9px;border-radius:50%;background:var(--hairline);border:none;padding:0;transition:all .2s}
.dotp.done{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.dotp.cur{background:var(--accent);width:22px;border-radius:99px}
@media (max-width:640px){
 .twocol,.threecol{grid-template-columns:1fr}
 .brand .sub{display:none}
}
@media (max-width:480px){
 .nav-in{gap:8px;padding:12px}
 .nav-in .btn{padding-left:14px;padding-right:14px}
 .dots{gap:5px}
}
.fig{margin:24px 0 0;background:var(--surface);border:1px solid var(--hairline-soft);border-radius:18px;padding:16px 16px 12px;box-shadow:var(--shadow-sm)}
.fig svg{width:100%;height:auto;display:block;font-family:var(--font-body)}
.fig figcaption{font-size:.86rem;color:var(--muted);margin-top:8px;text-align:center}
.quote{margin:22px 0 0;background:var(--navy);color:#fff;border-radius:var(--r-card);padding:26px 28px;box-shadow:var(--shadow-md);position:relative}
.quote .qi{color:var(--accent);display:block}
.quote p{font-family:var(--font-display);font-size:1.3rem;line-height:1.35;margin-top:8px}
.quote cite{display:block;margin-top:12px;font-style:normal;font-size:.86rem;color:color-mix(in srgb,#fff 70%,transparent)}
.bron{font-size:.82rem;color:var(--muted);margin-top:20px;padding-top:12px;border-top:1px dashed var(--hairline)}
.ch{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.vlist{margin:10px 0 0;padding-left:20px}.vlist li+li{margin-top:4px}
.video.empty .vd{font-size:.85rem;opacity:.7;margin-top:4px}
.mix{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.mix div{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.mix b{display:block;font-family:var(--font-display);font-size:1.7rem;color:var(--navy);line-height:1}
.mix span{font-size:.84rem;color:var(--muted)}
.reflq,.casbox{display:flex;gap:14px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:18px;padding:18px 20px;margin-top:22px}
.casbox{background:var(--surface);border:1px solid var(--hairline-soft);box-shadow:var(--shadow-sm)}
.reflq .cic,.casbox .cic{width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface);color:var(--accent-ink);display:grid;place-items:center}
.casbox .cic{background:var(--navy);color:var(--accent)}
.ta{width:100%;margin-top:18px;border:1.5px solid var(--hairline);border-radius:14px;padding:14px 16px;font:inherit;font-size:1rem;background:var(--surface);color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--accent)}
.tameta{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin-top:6px}
.prevrefl{margin-top:16px;border-left:3px solid var(--accent);padding:6px 14px}
.prevrefl .pl{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.prevrefl p{white-space:pre-wrap;margin-top:4px}
.wid .wl{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-weight:600;color:var(--navy);margin-bottom:12px}
.wid input[type=range]{flex:1;min-width:160px;accent-color:var(--navy)}
.wid output{min-width:60px;font-family:var(--font-display);font-size:1.2rem}
.wid select{font:inherit;padding:6px 10px;border-radius:10px;border:1.5px solid var(--hairline);background:var(--surface)}
.wid svg{width:100%;height:auto;display:block}
@media (max-width:560px){.mix{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="elearnings.html" title="Terug naar alle e-learnings"><span class="dot">C</span>Colleo <span class="sub">e-learning</span></a>
    <div class="top-r">
      <span class="stepcount" id="count"></span>
      <button class="menu-btn" id="menuBtn" aria-label="Overzicht van de module"></button>
    </div>
  </div>
</header>
<div class="prog"><i id="bar"></i></div>
<div class="drawer" id="drawer"><div class="scrim" data-close></div><aside class="panel" aria-label="Overzicht"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Overzicht</h3><button class="menu-btn" data-close aria-label="Sluiten">✕</button></div><div id="outline"></div></aside></div>
<main class="main"><section class="pane" id="pane" aria-live="polite"></section></main>
<nav class="nav"><div class="nav-in">
  <button class="btn btn-ghost" id="prev"></button>
  <div class="dots" id="dots"></div>
  <button class="btn btn-primary" id="next"></button>
</div></nav>
<script>
window.MODULE = {"id": "pijn3", "titel": "Complexe pijn: begrijpen en in beweging brengen", "delen": {"0": "Start", "1": "Pijn begrijpen", "2": "Het gevoelige alarm", "3": "Het brein als filter", "4": "Context en omgeving", "5": "Pijneducatie in de praktijk", "6": "De beweegpijler", "7": "Afronden"}, "stappen": [{"type": "video", "blok": 0, "titel": "Welkom en waarom deze module", "youtube": "", "intro": "Een korte kennismaking: waarom deze module, hoe ze opgebouwd is en hoe je ze het best doorloopt.", "punten": ["Waarom complexe pijn zoveel kinesitherapeuten uitdaagt", "De zeven delen van de module", "Hoe je de module het best volgt"], "duur": "± 3 min", "script": "V0.1"}, {"type": "reflectie", "blok": 0, "titel": "Jouw patiënt als rode draad", "vraag": "Denk aan één patiënt uit je praktijk met aanhoudende pijn bij wie je vastloopt. Beschrijf hem of haar kort: leeftijd, klacht, hoe lang al, wat al geprobeerd werd, en wat jij moeilijk vindt.", "tip": "Je antwoord blijft enkel in je eigen browser bewaard. Op het einde van de module kom je bij deze patiënt terug.", "min": 5}, {"type": "video", "blok": 1, "titel": "De omvang van het probleem en de woorden die we kiezen", "youtube": "", "intro": "Hoe groot is het probleem, en waarom kiezen we bewust voor de term 'complexe' pijn?", "punten": ["Prevalentie in Europa en België", "Lage rugpijn als grootste oorzaak van jaren met beperking", "Chronisch versus complex: woorden hebben effect", "Realistische hoop als doel"], "duur": "± 3 min", "script": "V1.1"}, {"type": "lezen", "blok": 1, "kaarten": [{"h": "Een van de grootste gezondheidsproblemen", "p": ["Aanhoudende pijn is een van de belangrijkste oorzaken van ziektelast. In een Europese bevraging bij meer dan 46.000 mensen had ongeveer één op vijf volwassenen matige tot ernstige pijn die al langer dan drie maanden duurde. Bijna de helft daarvan had constante pijn, en meer dan 60% kon minder of niet meer werken.", "In België geeft ongeveer een kwart van de bevolking aan dat pijn het dagelijks leven hindert. Dat aandeel steeg tussen 2013 en 2018, en ligt hoger bij vrouwen en bij mensen met een lagere opleiding."], "stats": [{"big": "± 1 op 5", "txt": "Europeanen met matige tot ernstige chronische pijn"}, {"big": "± 1 op 4", "txt": "Belgen bij wie pijn het dagelijks leven hindert"}, {"big": "619 miljoen", "txt": "mensen wereldwijd met lage rugpijn (2020)"}], "bron": "Breivik et al., Eur J Pain 2006; Sciensano Gezondheidsenquête 2018; GBD 2021 Low Back Pain Collaborators, Lancet Rheumatol 2023."}, {"h": "Herken je dit profiel?", "p": ["In de anamnese herken je complexe pijn vaak aan een cluster van kenmerken. Geen enkel kenmerk is op zich diagnostisch, maar samen wijzen ze in de richting van een dominante nociplastische component."], "genummerd": ["Pijn en andere lichamelijke symptomen domineren al lange tijd het dagelijks functioneren.", "De pijn verspringt, breidt uit of neemt toe, zonder overeenkomstige structurele bevindingen.", "Bewegingsgerelateerde pijn neemt toe en het activiteitenniveau wordt geleidelijk ingeperkt.", "Er is een voorgeschiedenis van tegenstrijdige adviezen van verschillende zorgverleners.", "De patiënt voelt zich niet erkend door zorgverleners of naasten."]}, {"h": "Chronisch of complex?", "twee": [{"k": "Chronisch", "l": ["Beschrijft enkel een tijdscriterium: langer dan 3 maanden", "Continu of recurrent (met pijnvrije periodes)", "Klinkt voor veel patiënten als 'voor altijd'", "Risico op nocebo-effect en passieve coping"]}, {"k": "Complex", "l": ["Benadrukt het multifactoriële karakter", "Het zenuwstelsel is plastisch: klachten zijn (deels) omkeerbaar", "Erkent dat het niet eenvoudig te behandelen is", "Opent de deur naar een bio-psycho-sociale aanpak"]}], "tip": "Het doel is niet 'pijnvrij', maar realistische hoop: een leven waarin de pijn minder ruimte inneemt en er opnieuw plaats is voor wat waardevol is."}, {"h": "Chronische primaire pijn in ICD-11", "p": ["Sinds ICD-11 bestaat er een aparte diagnose voor chronische pijn. Chronische pijn is pijn die langer dan drie maanden aanhoudt of terugkeert. Men onderscheidt chronische primaire pijn, waarbij de pijn een aandoening op zich is, en chronische secundaire pijn, waarbij de pijn een symptoom is van een andere aandoening.", "Chronische primaire pijn gaat gepaard met belangrijke emotionele distress of functionele beperking, en wordt niet beter verklaard door een andere aandoening. Niet-specifieke lage rugpijn en fibromyalgie zijn typische voorbeelden."], "tabel": {"kop": ["Chronische primaire pijn", "Chronische secundaire pijn (voorbeelden)"], "rijen": [["Pijn als aandoening op zich", "Kankergerelateerde pijn"], ["Bv. niet-specifieke lage rugpijn, fibromyalgie, chronische wijdverspreide pijn", "Postoperatieve of posttraumatische pijn"], ["Emotionele distress of functionele beperking", "Neuropathische pijn"], ["Niet beter verklaard door een andere aandoening", "Secundaire musculoskeletale of viscerale pijn, hoofdpijn"]]}, "bron": "Treede et al., Pain 2019; Nicholas et al., Pain 2019 (IASP-classificatie voor ICD-11)."}]}, {"type": "video", "blok": 1, "titel": "Wat is pijn? Alarm, nociceptie en de definitie", "youtube": "", "intro": "Pijn als alarm, het verschil tussen nociceptie en pijn, en de herziene IASP-definitie van 2020.", "punten": ["Van prikkel naar pijnbeleving", "De IASP-definitie (2020) en haar toelichtingen", "Nociceptie zonder pijn en pijn zonder nociceptie", "Wat dit betekent voor je klinisch redeneren"], "duur": "± 3 min", "script": "V1.2"}, {"type": "lezen", "blok": 1, "kaarten": [{"h": "De IASP-definitie van pijn", "quote": {"t": "Pijn is een onaangename sensorische en emotionele ervaring die samenhangt met, of lijkt op wat samenhangt met, feitelijke of potentiële weefselschade.", "src": "IASP · herziene definitie 2020"}, "lijst": ["Pijn is altijd een persoonlijke ervaring, in wisselende mate beïnvloed door biologische, psychologische en sociale factoren.", "Pijn en nociceptie zijn verschillende fenomenen. Pijn kan niet louter afgeleid worden uit activiteit in sensorische neuronen.", "Mensen leren het concept pijn doorheen hun levenservaringen.", "Wanneer iemand een ervaring als pijn rapporteert, moet dat gerespecteerd worden.", "Pijn heeft meestal een adaptieve rol, maar kan nadelige effecten hebben op functioneren en sociaal en psychisch welzijn.", "Verbale beschrijving is maar één manier om pijn te uiten; wie niet kan communiceren, kan wel pijn hebben."], "bron": "Raja et al., Pain 2020; iasp-pain.org."}, {"h": "Nociceptie is niet hetzelfde als pijn", "svg": "pathway", "p": ["Nociceptoren zitten in huid, slijmvliezen, spieren, gewrichten, bindweefsel, bot en organen. Ze reageren op mechanische prikkels (druk, rek, knijpen), thermische prikkels (warmte en koude boven of onder een drempel) en chemische prikkels (bv. ontstekingsmediatoren, capsaïcine).", "De nociceptieve input loopt via de eerste-orde neuron naar de achterhoorn, schakelt over op de tweede-orde neuron, kruist en stijgt via de tractus spinothalamicus naar de thalamus en de cortex. Pas daar wordt beslist óf er pijn ontstaat."], "tip": "Nociceptie is noch voldoende, noch noodzakelijk voor pijn. Er is nociceptie zonder pijn (stress-geïnduceerde analgesie) en pijn zonder nociceptie (bv. bij nociplastische pijn)."}, {"h": "Drie pijnmechanismen", "drie": [{"k": "Nociceptief", "s": "Door (dreigende) weefselschade", "l": ["Lokale pijn, soms uitstralend in een herkenbaar patroon", "Duidelijk ontstaansmoment", "Pijn meestal in verhouding tot de schade"]}, {"k": "Neuropathisch", "s": "Door letsel of aandoening van het zenuwstelsel", "l": ["Uitstraling volgens zenuwverloop", "Schietend of brandend", "Soms doofheid, tintelingen, elektrische schokken"]}, {"k": "Nociplastisch", "s": "Door veranderde pijnverwerking", "l": ["Geen voldoende verklarende weefsel- of zenuwschade", "Hyperalgesie en allodynie, vaak wijdverspreid", "Overgevoeligheid voor andere prikkels, vermoeidheid, slaapproblemen"]}], "p": ["De meeste patiënten hebben een mengeling. Bij complexe pijn staat de nociplastische component vaak op de voorgrond. Voor het herkennen ervan bestaan sinds 2021 klinische criteria van de IASP."], "bron": "Kosek et al., Pain 2016; Kosek et al., Pain 2021."}]}, {"type": "check", "blok": 1, "vragen": [{"q": "Wat zegt de IASP-definitie van 2020 over het verband tussen pijn en weefselschade?", "a": ["Pijn heeft niets met weefselschade te maken", "Pijn bewijst altijd weefselschade", "Pijn kan samenhangen met, of lijken op wat samenhangt met, weefselschade"], "c": 2, "u": "Door de woorden 'of lijkt op' erkent de definitie dat pijn kan optreden zonder weefselschade, en dat die pijn even echt is."}, {"q": "Een voetballer speelt met een gebroken teen de wedstrijd uit zonder veel pijn. Wat illustreert dit?", "a": ["Pijn zonder nociceptie", "Neuropathische pijn", "Nociceptie zonder (veel) pijn"], "c": 2, "u": "Er is wel nociceptieve input, maar de hersenen dempen die door de context: stress-geïnduceerde analgesie."}, {"q": "Welk pijnmechanisme staat bij complexe pijn vaak op de voorgrond?", "a": ["Neuropathisch", "Nociplastisch", "Nociceptief"], "c": 1, "u": "Nociplastische pijn ontstaat door een veranderde verwerking van nociceptieve informatie, zonder voldoende verklarende schade."}]}, {"type": "video", "blok": 2, "titel": "Het alarm dat te gevoelig staat", "youtube": "", "intro": "Wat gebeurt er wanneer het alarmsysteem te gevoelig blijft staan? Sensitisatie op spinaal en supraspinaal niveau.", "punten": ["De alarmmetafoor", "Centrale sensitisatie in de achterhoorn", "Gaspedaal en rempedaal: descenderende modulatie", "Hyperalgesie en allodynie", "Niet de brandweer, maar de technieker"], "duur": "± 3 min", "script": "V2.1"}, {"type": "lezen", "blok": 2, "kaarten": [{"h": "Het alarm dat te gevoelig staat", "svg": "alarm", "p": ["Pijn is in essentie een beschermingsreactie. Kinderen met een aangeboren ongevoeligheid voor pijn lopen herhaaldelijk ernstige letsels op: een systeem dat te ongevoelig is, beschermt niet.", "Na een letsel is een tijdelijke verhoogde gevoeligheid (perifere en centrale sensitisatie) adaptief: ze beschermt het herstellende weefsel. Normaal dooft die uit binnen enkele weken tot maanden. Gebeurt dat niet, dan blijven nociceptieve neuronen in het centrale zenuwstelsel overgevoelig. Het systeem handelt in het belang van de patiënt, maar staat te scherp afgesteld."], "tip": "Verder zoeken naar een structurele oorzaak (de brand die er niet is) levert weinig op. De focus verschuift naar het opnieuw afstellen van het systeem."}, {"h": "Sensitisatie in de achterhoorn", "genummerd": ["Verhoogde synaptische efficiëntie: de respons van tweede-orde neuronen op dezelfde input neemt toe (o.a. NMDA-gemedieerde wind-up).", "Langere openingstijd van ionkanalen: dezelfde input geeft een sterkere en langere depolarisatie.", "Upregulatie van receptoren: zelfs lichte aanraking (Aβ-input) kan nociceptieve projectieneuronen activeren."], "p": ["Door de convergentie van input uit huid, spieren, gewrichten en organen op dezelfde neuronen gaat ook somatotope precisie verloren. Dat verklaart gerefereerde en uitbreidende pijn."], "bron": "Latremoliere & Woolf, J Pain 2009."}, {"h": "Gaspedaal en rempedaal", "svg": "pedals", "twee": [{"k": "Facilitatie (gaspedaal)", "l": ["Pijncatastroferen", "Bewegingsangst (kinesiofobie)", "Depressie en stress", "Pijnverwachting", "Ervaren onrechtvaardigheid"]}, {"k": "Inhibitie (rempedaal)", "l": ["Sociale verbondenheid, humor, aanraking", "Betekenisvolle activiteit", "Wandelen in de natuur", "Rustige ademhaling", "Gedoseerde beweging"]}], "p": ["Vanuit de hersenstam (o.a. periaqueductale grijze stof en rostroventrale medulla) lopen banen naar de achterhoorn die nociceptieve transmissie kunnen dempen of versterken. Bij complexe pijn verschuift de balans vaak richting facilitatie. De behandeling mikt op het heractiveren van het rempedaal."]}, {"h": "Hyperalgesie en allodynie", "stats": [{"big": "Hyperalgesie", "txt": "Een licht pijnlijke prikkel geeft onevenredig veel pijn: een pingpongbal voelt als een bowlingbal."}, {"big": "Allodynie", "txt": "Een prikkel die normaal niet pijnlijk is, doet pijn: op een erwt zitten, lakens op de huid."}], "p": ["Bij nociplastische pijn zie je dat vaak in een groter of wisselend gebied, soms samen met overgevoeligheid voor licht, geluid of geur, vermoeidheid, slaap- en concentratieproblemen."]}, {"h": "De vervormde lichaamskaart", "p": ["De corticale representatie van het lichaam is de basis voor positiebesef en motorische controle. Bij aanhoudende pijn kan die kaart aan detail verliezen: aangrenzende representaties vervagen ('smudging'). Patiënten beschrijven dan dat iets 'niet op zijn plaats zit', een geblokkeerd of vreemd gevoel, subjectieve zwakte of moeite om een lichaamsdeel te bewegen.", "Vermijden van bewegen ontneemt de hersenen accurate input, waardoor de kaart verder vervaagt. Graduele blootstelling aan beweging herstelt de resolutie."], "tip": "Laat de patiënt ook bewust stilstaan bij lichaamsdelen en sensaties die goed aanvoelen. Zo krijgen niet-pijnlijke zones opnieuw aandacht.", "bron": "Moseley & Gallace, Neurosci Biobehav Rev 2012."}]}, {"type": "check", "blok": 2, "vragen": [{"q": "Een patiënt ervaart pijn wanneer de lakens zijn huid raken. Hoe noem je dit?", "a": ["Hyperalgesie", "Allodynie", "Nociceptie"], "c": 1, "u": "Allodynie is pijn bij een prikkel die normaal niet pijnlijk is."}, {"q": "Welke bevinding past het best bij een nociplastische component?", "a": ["Uitstralende pijn volgens een dermatoom met krachtverlies", "Scherp afgelijnde pijn die enkel bij één specifieke belasting optreedt", "Wijdverspreide pijn met pijn bij lichte aanraking, slecht slapen en overgevoeligheid voor geluid"], "c": 2, "u": "Wijdverspreide pijn, overgevoeligheid bij onderzoek en bijkomende klachten zoals slaapproblemen en sensorische overgevoeligheid wijzen op een nociplastische component. De derde optie past eerder bij radiculaire (neuropathische) pijn."}, {"q": "Wat is de beste vergelijking voor de rol van de kinesitherapeut bij centrale sensitisatie?", "a": ["De bewaker die het alarm uitschakelt", "De brandweer die de brand blust", "De technieker die het alarm opnieuw afstelt"], "c": 2, "u": "Er is geen brand meer om te blussen. We helpen het systeem opnieuw correct af te stellen, onder meer via educatie en gedoseerde beweging."}]}, {"type": "video", "blok": 2, "titel": "Pijn is geen meetlat voor schade", "youtube": "", "intro": "Hoe langer de pijn duurt, hoe kleiner het verband met weefselschade. Wat zeggen beeldvorming en weefselherstel?", "punten": ["Weefselherstel versus pijn over de tijd", "Afwijkingen op MRI bij mensen zonder pijn", "De studie met 200 mensen zonder rugpijn", "Hoe je antwoordt op 'maar ik heb toch artrose?'"], "duur": "± 3 min", "script": "V2.2"}, {"type": "lezen", "blok": 2, "kaarten": [{"h": "Weefsels herstellen, pijn niet altijd", "svg": "healing", "p": ["Na de ontstekingsfase daalt de pijn die aan het weefsel gekoppeld is mee met het herstel. Pijn die gekoppeld is aan het centrale zenuwstelsel kan hoog en golvend blijven, los van het weefsel. Dat verklaart ook waarom beeldvorming slecht correleert met de pijn."], "tip": "Een geruststellende boodschap voor de patiënt: je maakt niets kapot door te bewegen. We zijn het alarm aan het uitdoven."}, {"h": "Wat zie je op een scan bij mensen zónder pijn?", "svg": "mri", "p": ["Een systematische review bundelde de MRI- en CT-bevindingen van meer dan 3.000 mensen zonder rugpijn. Degeneratieve veranderingen bleken zeer frequent en namen toe met de leeftijd."], "tabel": {"kop": ["Bevinding (zonder rugpijn)", "20 jaar", "80 jaar"], "rijen": [["Discusdegeneratie", "37%", "96%"], ["Discus bulging", "30%", "84%"], ["Discusprotrusie", "29%", "43%"], ["Annulaire fissuur", "19%", "29%"]]}, "bron": "Brinjikji et al., AJNR 2015."}, {"h": "Nieuwe pijn, maar dezelfde scan", "stat": {"big": "84%", "txt": "van de mensen die een nieuwe, stevige episode lage rugpijn kregen, had op een nieuwe MRI géén nieuwe bevinding: het beeld was onveranderd of zelfs verbeterd (51 van 200 gevolgde personen)."}, "p": ["De auteurs besloten dat MRI-bevindingen kort na een episode van rugpijn zeer onwaarschijnlijk een nieuwe structurele verandering weerspiegelen. Nieuwe zenuwwortelcompressie kwam enkel voor bij radiculaire klachten."], "bron": "Carragee et al., Spine J 2006."}, {"h": "'Maar ik heb toch artrose?'", "p": ["Een eerlijke vraag die een eerlijk antwoord verdient. Bouw je antwoord op met deze bouwstenen:"], "genummerd": ["Erken: ja, er kunnen structurele veranderingen zijn, en je pijn is echt.", "Nuanceer: mensen met exact dezelfde beelden hebben soms veel en soms geen pijn. Veel bevindingen horen bij normale veroudering, de 'grijze haren' van de wervelkolom.", "Wijs op de schommelingen: je pijn verschilt van dag tot dag, terwijl je scan dezelfde blijft. Er speelt dus meer mee dan het weefsel.", "Geef perspectief: de structuur is stabiel en sterk. Bewegen is veilig en net wat het lichaam nodig heeft."], "tip": "Stem af op de patiënt. Bij wie vastzit in een structureel verhaal is dit cruciaal; bij anderen hoef je er nauwelijks bij stil te staan.", "let": false}]}, {"type": "video", "blok": 2, "titel": "Nociplastische pijn herkennen in je onderzoek", "youtube": "", "intro": "Hoe herken je een dominante nociplastische component in je anamnese en onderzoek?", "punten": ["De klinische criteria van de IASP (2021) in stappen", "Positieve kenmerken zoeken, geen uitsluitingsdiagnose", "Mogelijk versus waarschijnlijk nociplastisch", "Wat dit verandert aan je behandeling"], "duur": "± 3,5 min", "script": "V2.3"}, {"type": "lezen", "blok": 2, "kaarten": [{"h": "Klinische criteria voor nociplastische pijn", "genummerd": ["Chronische pijn: langer dan 3 maanden.", "Regionale, multifocale of wijdverspreide verdeling, eerder dan een afgelijnde, discrete pijn.", "Niet volledig verklaard door nociceptieve mechanismen (geen voldoende verklarende weefselschade of ontsteking).", "Niet volledig verklaard door neuropathische mechanismen (geen letsel of aandoening van het somatosensorische zenuwstelsel die het patroon verklaart).", "Klinische tekenen van overgevoeligheid in het pijnlijke gebied: bv. pijn bij lichte aanraking of strijken, bij druk, bij koude of warmte, of nazinderende pijn."], "twee": [{"k": "Mogelijk nociplastisch", "l": ["Bovenstaande pijnkenmerken", "Overgevoeligheid bij klinisch onderzoek"]}, {"k": "Waarschijnlijk nociplastisch", "l": ["Daarbovenop: voorgeschiedenis van overgevoeligheid in het pijngebied", "Én bijkomende klachten: overgevoeligheid voor licht, geluid of geur; slaapproblemen; vermoeidheid; concentratie- of geheugenproblemen"]}], "tip": "Het is geen of-of: een nociplastische component kan samengaan met een nociceptieve (bv. bij artrose). De vraag is welk mechanisme op de voorgrond staat.", "bron": "Kosek et al., Pain 2021; Nijs et al., Lancet Rheumatol 2021."}, {"h": "Wat het verandert aan je aanpak", "tabel": {"kop": ["Dominant mechanisme", "Accent in de behandeling"], "rijen": [["Nociceptief", "Weefselgerichte aanpak en belastingsmanagement; uitleg over herstel; geleidelijke opbouw."], ["Neuropathisch", "Neurologisch onderzoek, samenwerking met de arts; eventueel medicamenteuze aanpak; zenuwmobiliteit en activiteit."], ["Nociplastisch", "Pijneducatie, tijdscontingente opbouw, graduele blootstelling, aandacht voor slaap, stress en overtuigingen; vaak multidisciplinair."]]}}]}, {"type": "casus", "blok": 2, "titel": "Casus: het MRI-verslag", "situatie": "Marc (46, magazijnier) komt met een MRI-verslag: 'degeneratieve discopathie L4-L5 en L5-S1, kleine posterieure bulging'. Hij zegt: 'Zie je wel, mijn rug is versleten. Ik moet stoppen met tillen, anders zit ik straks in een rolstoel.' Wat zeg je het best?", "opties": [{"t": "'Klopt, dan stop je best inderdaad met tillen tot de pijn weg is.'", "fb": "Dit bevestigt zijn angst en zet de deur open voor vermijding, deconditionering en meer beperking."}, {"t": "'Dat valt wel mee, het staat er, maar het is niets.'", "fb": "Goedbedoeld, maar je minimaliseert zijn zorg en zijn verslag. Marc kan zich niet ernstig genomen voelen."}, {"t": "'Ik begrijp dat dit verslag je ongerust maakt. Weet je dat we zulke beelden ook zien bij de meeste mensen van je leeftijd zonder rugpijn? Je pijn wisselt van dag tot dag, terwijl je scan dezelfde blijft. Je rug is sterk, en bewegen is veilig.'", "fb": "Juist. Je erkent zijn zorg, geeft feitelijke nuance en een geruststellend, activerend perspectief.", "ok": true}]}, {"type": "video", "blok": 3, "titel": "Het brein als filter: de volumeknop", "youtube": "", "intro": "Waarom dezelfde prikkel de ene keer veel en de andere keer weinig pijn doet: aandacht, betekenis en verwachting.", "punten": ["De hersenen als filter", "De volumeknop van de radio", "Het experiment met de koude staaf (Moseley & Arntz)", "Pijnversterkers en pijndempers", "Het paadje in het bos"], "duur": "± 3 min", "script": "V3.1"}, {"type": "lezen", "blok": 3, "kaarten": [{"h": "De volumeknop", "svg": "volume", "p": ["De hersenen ontvangen permanent meer input dan ze bewust kunnen verwerken. Een gedistribueerd netwerk van sensorische, emotionele en cognitief-evaluatieve regio's bepaalt welke input relevant is. Pijn is geen product van één pijncentrum, maar een output van dat netwerk. Daardoor zijn geen twee pijnervaringen identiek."], "twee": [{"k": "Draait het volume open", "l": ["Aandacht en waakzaamheid voor pijn", "Angst, piekeren, catastroferen", "Slecht slapen, stress", "Eerdere pijnervaringen", "Pijn verwachten"]}, {"k": "Draait het volume stiller", "l": ["Afleiding en betekenisvolle bezigheid", "Een veilige, positieve context", "Sociale verbondenheid en aanraking", "Beloning en plezier", "Gedoseerde beweging"]}]}, {"h": "Betekenis verandert pijn", "stats": [{"big": "−20 °C", "txt": "dezelfde korte prikkel op de hand"}, {"big": "rood", "txt": "'dit wordt heet en schadelijk': de prikkel deed meer pijn"}, {"big": "blauw", "txt": "'dit wordt koud': minder pijn"}], "p": ["In het experiment van Moseley en Arntz werd een prikkel na een rood lichtje (betekenis: heet, schadelijk) als heter, onaangenamer en pijnlijker beoordeeld dan exact dezelfde prikkel na een blauw lichtje. Waarschuwing vooraf en kijken naar de prikkel versterkten de pijn enkel wanneer de betekenis 'schade' was."], "bron": "Moseley & Arntz, Pain 2007."}, {"h": "Psychologische modulatoren", "tabel": {"kop": ["Factor", "Wat zie je?"], "rijen": [["Aandacht", "Hypervigilantie voor pijn verhoogt de gevoeligheid; wordt pijnvermindering hét levensdoel, dan krijgt pijn net meer gewicht."], ["Gedachten en overtuigingen", "Wie een beweging als bedreigend inschat, activeert het gaspedaal, nog vóór er weefselbelasting is."], ["Geheugen", "Eerder aan pijn gekoppelde situaties (bv. tillen na een rugpijnepisode) kunnen pijn reactiveren; zelfs aan een beweging denken kan pijn uitlokken."], ["Emoties", "Angst, woede ('waarom ik?'), somberheid versterken het alarm; positieve emoties dempen."], ["Stress", "Niet de stressor maar het vermogen om ermee om te gaan is bepalend."], ["Gevolgen", "Dezelfde vingerwonde is bedreigender voor een concertviolist dan voor een danser."]]}, "bron": "Moseley, Phys Ther Rev 2007; Zimney, Van Bogaert & Louw, J Clin Med 2023."}, {"h": "Ook de ogen laten zich misleiden", "svg": "illusion", "p": ["Welke oranje cirkel is het grootst? De meeste mensen kiezen de rechtse, maar ze zijn even groot. De hersenen interpreteren input altijd in context, en kunnen zich daarbij vergissen. Hetzelfde kan gebeuren met signalen uit het lichaam: het brein kan gevaar 'zien' waar er geen is."], "tip": "Een handige illustratie om in een consult te gebruiken: het geeft de patiënt geen schuld, het toont gewoon hoe hersenen werken."}]}, {"type": "video", "blok": 3, "titel": "De emmer, de drempel en de angst om te bewegen", "youtube": "", "intro": "De emmer en de gevoeligheidsdrempel, en hoe angst en vermijding iemand in een negatieve cirkel brengen.", "punten": ["De emmer die overloopt", "De gevoeligheidsdrempel", "Het vrees-vermijdingsmodel (Vlaeyen & Linton)", "Kraantje openzetten of de emmer vergroten"], "duur": "± 3 min", "script": "V3.2"}, {"type": "lezen", "blok": 3, "kaarten": [{"h": "De emmer", "svg": "bucket", "p": ["Allerlei factoren vullen de emmer: slecht slapen, stress, werk, piekeren, negatieve gedachten over pijn, eerdere ervaringen. Loopt de emmer over, dan voelen we pijn. Bij de ene persoon is de emmer groter, bij de andere zit hij al voller, bijvoorbeeld door langdurige stress."], "twee": [{"k": "Kraantje openzetten", "l": ["Beter slapen", "Stress en piekeren aanpakken", "Overtuigingen bijsturen", "Vaak samen met psycholoog of huisarts"]}, {"k": "De emmer vergroten", "l": ["Progressief bewegen", "Belastbaarheid opbouwen", "Succeservaringen", "De kracht van de kinesitherapeut"]}]}, {"h": "Het vrees-vermijdingsmodel", "svg": "fearavoid", "p": ["Na een pijnervaring kan iemand twee richtingen uit. Wie de pijn niet als bedreigend interpreteert, blijft bewegen en herstelt meestal. Wie de pijn catastrofaal interpreteert, ontwikkelt angst voor pijn en beweging, wordt hyperwaakzaam en gaat vermijden. Dat leidt tot deconditionering, somberheid en meer beperking, wat de pijn verder in stand houdt."], "tip": "Geruststelling, uitleg en gedoseerde blootstelling aan gevreesde bewegingen zijn de uitweg uit de cirkel.", "bron": "Vlaeyen & Linton, Pain 2000; Vlaeyen & Linton, Pain 2012."}, {"h": "Slaap en pijn", "p": ["De relatie tussen slaap en pijn werkt in twee richtingen. Ongeveer de helft van de mensen met chronische pijn rapporteert slaapproblemen, en slecht slapen verhoogt op zijn beurt de pijngevoeligheid en het risico dat pijn chronisch wordt. Slaapbeperking verhoogt bovendien ontstekingsmerkers.", "Slaap is daarom een van de eerste factoren om samen met de patiënt (en eventueel de huisarts) te bekijken."], "bron": "Finan, Goodin & Smith, J Pain 2013."}]}, {"type": "reflectie", "blok": 3, "titel": "Wat zit er in de emmer van je patiënt?", "vraag": "Denk opnieuw aan de patiënt die je in het begin beschreef. Welke factoren vullen zijn of haar emmer? Welke draaien het volume open, en welke zouden het stiller kunnen draaien? Wat is beïnvloedbaar?", "tip": "Maak een lijstje met twee kolommen: 'vult de emmer' en 'kraantje open'.", "min": 5}, {"type": "check", "blok": 3, "vragen": [{"q": "Wat toonde het experiment met het rode en blauwe lichtje aan?", "a": ["De betekenis van een prikkel verandert de pijn die hij oproept", "Koude prikkels zijn altijd pijnlijker", "Kleur heeft geen invloed op pijn"], "c": 0, "u": "Exact dezelfde prikkel deed meer pijn wanneer hij als heet en schadelijk werd aangekondigd."}, {"q": "Wat leidt volgens het vrees-vermijdingsmodel tot een negatieve cirkel?", "a": ["Een rustige interpretatie van pijn", "Catastrofaal denken, angst en vermijding", "Te veel bewegen op goede dagen"], "c": 1, "u": "Catastroferen leidt tot angst, waakzaamheid en vermijding, en daardoor tot deconditionering en meer beperking."}, {"q": "Hoe kan een kinesitherapeut volgens de emmer-metafoor vooral helpen?", "a": ["De emmer vergroten door progressief te bewegen", "De emmer verkleinen door rust", "Niets, de emmer is vast"], "c": 0, "u": "Progressieve beweging vergroot de belastbaarheid. Daarnaast kunnen beïnvloedbare factoren de emmer helpen leegmaken."}]}, {"type": "video", "blok": 4, "titel": "Context, omgeving en de zorgverlener als modulator", "youtube": "", "intro": "Hoe situatie, omgeving, werk en zelfs de zorgverlener de pijn mee bepalen.", "punten": ["De duimspijker en de krokodil", "Wat vrienden en familie zeggen", "Werk, hobby's en sociale contacten", "De zorgverlener als modulator: woorden en houding"], "duur": "± 3 min", "script": "V4.1"}, {"type": "lezen", "blok": 4, "kaarten": [{"h": "Sociale en leefstijlmodulatoren", "tabel": {"kop": ["Factor", "Effect"], "rijen": [["Sociale en financiële context", "Huisvesting, steun, erkenning en een stabiel inkomen beschermen; isolatie en eenzaamheid verhogen de pijngevoeligheid."], ["Werk", "Werkdruk, onzekerheid en conflicten verhogen de alarmbereidheid; een zinvolle dagbesteding beschermt."], ["Cultuur en opvoeding", "Bepalen mee pijnovertuigingen en pijngedrag; kinderen leren door observatie."], ["Voeding en gewicht", "Overgewicht voorspelt het aanhouden van klachten; een ongezond voedingspatroon kan bijdragen aan sensitisatie."], ["Beweging", "Adequaat gedoseerde beweging activeert de lichaamseigen pijnremming."]]}, "bron": "Nijs et al., Br J Anaesth 2019; Orhan et al., Pain Physician 2018."}, {"h": "De zorgverlener als modulator", "p": ["Onzekerheid, gebrek aan informatie en verlies van controle geven bij iedereen stress. Tegenstrijdige adviezen, mislukte behandelingen en het gevoel niet geloofd te worden, versterken het alarm. Ook goedbedoeld advies kan de dreiging vergroten."], "tabel": {"kop": ["Liever niet", "Liever wel"], "rijen": [["'Uw rug is versleten.'", "'Dit zijn normale veranderingen voor je leeftijd.'"], ["'U hebt de rug van een tachtigjarige.'", "'Je rug is sterk en past zich aan.'"], ["'Die wervel staat scheef.'", "'Er bestaat geen perfecte houding; afwisselen is wat telt.'"], ["'Voorzichtig met bukken!'", "'Bukken is veilig; we bouwen het samen rustig op.'"], ["'Het zit tussen uw oren.'", "'Je pijn is echt; je alarmsysteem staat te gevoelig.'"]]}, "tip": "Kijk je patiënt aan in plaats van naar je scherm. Erkenning dat de pijn echt is, is vaak de eerste stap naar minder dreiging."}, {"h": "Risico op chroniciteit inschatten", "p": ["Bij lage rugpijn sluit je eerst ernstige pathologie uit via rode vlaggen. In ongeveer 90% van de gevallen gaat het om niet-specifieke lage rugpijn, waarbij beeldvorming meestal niet zinvol is. Daarna schat je het risico op aanhoudende klachten in, bijvoorbeeld met de STarT Back Tool, en evalueer je gele vlaggen (psychosociale prognostische factoren)."], "tabel": {"kop": ["Risico", "Aanpak"], "rijen": [["Laag", "Zelfmanagement: geruststelling, uitleg, actief blijven. Herevalueer als het na enkele weken niet verbetert."], ["Gemiddeld", "Kinesitherapie met een multimodaal programma: oefentherapie, eventueel manuele technieken, met aandacht voor overtuigingen."], ["Hoog", "Multidisciplinaire aanpak met psychologische en sociale ondersteuning."]]}, "bron": "Hill et al., Lancet 2011; KCE-richtlijn lage rugpijn en radiculaire pijn (rapport 287, 2017)."}, {"h": "Belgische richtlijn in een notendop", "lijst": ["Rugpijn is meestal onschadelijk: vermijd medicalisering en moedig zelfmanagement aan.", "Blijf in beweging; zet dagelijkse activiteiten zoveel mogelijk voort.", "Beeldvorming is bij niet-specifieke lage rugpijn meestal nutteloos en kan ongerustheid veroorzaken.", "Sluit altijd rode vlaggen uit.", "Bij verhoogd risico: zelfzorg aangevuld met kinesitherapie, manuele technieken of psychologische ondersteuning; bij zeer hoog risico een multimodaal programma.", "Terugkeer naar werk en activiteiten is een doel vanaf dag één."], "bron": "KCE 2017."}]}, {"type": "video", "blok": 4, "titel": "Screenen: rode vlaggen, risico en gele vlaggen", "youtube": "", "intro": "Een stap die je nooit overslaat: screenen op ernstige pathologie en op risico voor aanhoudende klachten.", "punten": ["Rode vlaggen en wanneer je dringend doorverwijst", "De STarT Back Tool: 9 vragen, 3 risicogroepen", "Gele vlaggen herkennen met open vragen"], "duur": "± 3,5 min", "script": "V4.2"}, {"type": "lezen", "blok": 4, "kaarten": [{"h": "Rode vlaggen bij lage rugpijn", "lijst": ["Voorgeschiedenis van kanker, onverklaard gewichtsverlies.", "Koorts, algemeen ziek zijn, immunosuppressie of intraveneus druggebruik.", "Recent (belangrijk) trauma, langdurig corticosteroïdgebruik of vermoeden van osteoporose.", "Nieuw ontstane rugpijn op jonge leeftijd of na de leeftijd van 50 jaar.", "Constante, progressieve pijn die in rust en 's nachts niet afneemt.", "Progressieve neurologische uitval (krachtverlies)."], "let": "Tekenen van een caudasyndroom (doof gevoel in het zitvlak, problemen met plassen of stoelgang, snel toenemende zwakte in de benen) vragen een dringende verwijzing naar de spoedgevallendienst.", "bron": "KCE 2017; Finucane et al., JOSPT 2020."}, {"h": "De STarT Back Tool", "p": ["Negen ja/nee-vragen (de laatste op een 5-puntenschaal) over uitstraling, beperkingen, schouder- of nekpijn, en vijf psychosociale items: angst om te bewegen, piekeren, catastroferen, somberheid en hinder."], "tabel": {"kop": ["Score", "Risico", "Aanpak"], "rijen": [["Totaal 0–3", "Laag", "Geruststelling, uitleg, actief blijven, zelfmanagement."], ["Totaal ≥ 4, psychosociale subscore ≤ 3", "Gemiddeld", "Kinesitherapie met oefentherapie en uitleg."], ["Psychosociale subscore ≥ 4", "Hoog", "Kinesitherapie met expliciete aandacht voor psychosociale factoren; overweeg multidisciplinair."]]}, "bron": "Hill et al., Arthritis Rheum 2008; Hill et al., Lancet 2011."}, {"h": "Gele vlaggen herkennen", "drie": [{"k": "Denken en voelen", "s": "Overtuigingen en emoties", "l": ["'Pijn betekent schade'", "Catastroferen", "Angst, somberheid", "Gevoel van onrecht"]}, {"k": "Doen", "s": "Gedrag", "l": ["Vermijden en veel rusten", "Overmatig doorzetten", "Passief afwachten van behandeling"]}, {"k": "Omgeving", "s": "Werk en sociale context", "l": ["Weinig steun op het werk", "Conflicten of onzekerheid", "Overbeschermende omgeving"]}], "tip": "Vijf open vragen: Wat denk je zelf dat de oorzaak is? Wat verwacht je van de behandeling? Hoe gaat het op je werk? Hoe reageert je omgeving? Wat is je grootste zorg?"}]}, {"type": "casus", "blok": 4, "titel": "Casus: een andere rugpijn", "situatie": "Jozef (67) komt met lage rugpijn die zes weken geleden begon zonder aanleiding. De pijn is constant, ook 's nachts, en verbetert niet met houding of rust. Hij vertelt terloops dat hij vijf kilo is afgevallen 'zonder te diëten' en vroeger behandeld werd voor prostaatkanker. Wat doe je?", "opties": [{"t": "De behandeling niet starten en hem nog dezelfde week, met een duidelijke verwijsbrief, naar de huisarts doorverwijzen voor verder onderzoek.", "fb": "Juist. Leeftijd, nieuwe constante nachtpijn, onverklaard gewichtsverlies en een voorgeschiedenis van kanker zijn samen een duidelijke rode vlag.", "ok": true}, {"t": "Starten met pijneducatie: waarschijnlijk is zijn alarmsysteem te gevoelig.", "fb": "Niet correct. Het kader van complexe pijn mag nooit een reden zijn om rode vlaggen te negeren."}, {"t": "Een graduele beweegopbouw starten en na zes weken herevalueren.", "fb": "Te afwachtend. De combinatie van rode vlaggen vraagt eerst medisch onderzoek."}]}, {"type": "casus", "blok": 4, "titel": "Casus: de goedbedoelde schoonbroer", "situatie": "Fatima (38) heeft al vijf maanden nekpijn. Ze vertelt dat haar schoonbroer, die 'ook een hernia had', haar heeft aangeraden om niet meer te sporten en een nekkraag te dragen. Sindsdien durft ze haar hoofd nauwelijks nog te draaien. Wat is je eerste stap?", "opties": [{"t": "Haar meteen zeggen dat haar schoonbroer ongelijk heeft.", "fb": "Je hebt inhoudelijk misschien gelijk, maar je zet haar in een loyaliteitsconflict en de boodschap komt niet aan."}, {"t": "Haar laten vertellen wat ze zelf denkt dat er aan de hand is en waar ze bang voor is, en van daaruit uitleg geven over het alarmsysteem.", "fb": "Juist. Je vertrekt van haar overtuigingen en angsten. Zo kan je de context (de schoonbroer, de kraag) mee in je uitleg verwerken.", "ok": true}, {"t": "De nekkraag gewoon laten dragen; dat is haar keuze.", "fb": "Autonomie is belangrijk, maar zonder uitleg versterkt de kraag het gevoel van kwetsbaarheid en de vermijding."}]}, {"type": "check", "blok": 4, "vragen": [{"q": "Waarom voel je een duimspijker minder als je door een krokodil achtervolgd wordt?", "a": ["Omdat de spijker minder diep zit", "Omdat er minder weefselschade is", "Omdat de hersenen de pijn dempen: ontsnappen is belangrijker"], "c": 2, "u": "De context bepaalt welke prikkels prioriteit krijgen; het descenderende systeem dempt de pijn."}, {"q": "Een STarT Back-score toont een psychosociale subscore van 4. Welke aanpak past?", "a": ["Kinesitherapie met expliciete aandacht voor psychosociale factoren, eventueel multidisciplinair", "Meteen beeldvorming aanvragen", "Enkel geruststelling en zelfmanagement"], "c": 0, "u": "Een psychosociale subscore van 4 of meer betekent hoog risico: een aanpak die ook overtuigingen, angst en context meeneemt."}, {"q": "Welke formulering helpt het best?", "a": ["'Je pijn is echt; je alarmsysteem staat te gevoelig.'", "'Het zit tussen je oren.'", "'Je rug is versleten.'"], "c": 0, "u": "Je erkent de pijn en geeft een geruststellende, begrijpelijke verklaring."}]}, {"type": "video", "blok": 5, "titel": "Pijneducatie: wat werkt en hoe pak je het aan?", "youtube": "", "intro": "Wat het onderzoek zegt over pijneducatie, en een praktische opbouw voor je gesprek.", "punten": ["Pijneducatie werkt het best samen met beweging", "Een gesprek in vijf stappen", "Spreiden over meerdere contacten met geschreven info", "Je metaforenkoffer"], "duur": "± 3 min", "script": "V5.1"}, {"type": "lezen", "blok": 5, "kaarten": [{"h": "Wat zegt de evidentie?", "stats": [{"big": "5 RCT's", "txt": "460 deelnemers: pijneducatie + oefentherapie vs. oefentherapie alleen"}, {"big": "↓ angst", "txt": "Bewegingsangst daalde meer (matige zekerheid)"}, {"big": "↓ pijn", "txt": "Ook pijn en beperking daalden meer op korte termijn (lage zekerheid)"}], "p": ["Pijneducatie (pain neuroscience education) helpt patiënten pijn opnieuw te begrijpen. Op zichzelf is het geen wondermiddel; het effect zit vooral in de combinatie met actieve behandeling. Educatie maakt beweging mogelijk, beweging maakt de boodschap voelbaar."], "bron": "Siddall et al., Pain 2022; Louw et al., Physiother Theory Pract 2016; Zimney et al., J Clin Med 2023."}, {"h": "Zo start je het gesprek", "genummerd": ["Start bij de patiënt: 'Hoe heeft de pijn invloed op je leven?'", "Vraag toestemming: 'Vind je het goed dat ik je wat meer uitleg geef over hoe pijn werkt?'", "Vertrek van zijn beeld: 'Wat denk jij dat er aan de hand is? Wat betekent pijn voor jou?'", "Leg uit in kleine stukjes, met één beeld per keer: alarm, volumeknop, emmer.", "Check: 'Wat herken je hiervan? Kan je het in je eigen woorden uitleggen?'", "Geef geschreven informatie mee en kom er het volgende consult op terug."], "tip": "Educatie is geen eenmalige les. Spreid ze over minstens twee contacten en verweef ze daarna in de actieve behandeling.", "bron": "Nijs et al., Man Ther 2011."}, {"h": "Je metaforenkoffer", "tabel": {"kop": ["Metafoor", "Wat leg je ermee uit?"], "rijen": [["Het alarmsysteem", "Pijn beschermt, maar kan te gevoelig worden afgesteld. Je belt de technieker, niet de brandweer."], ["De volumeknop", "Hetzelfde signaal kan luider of stiller binnenkomen, afhankelijk van aandacht, betekenis en context."], ["De emmer", "Meerdere factoren tellen op; wanneer de emmer overloopt, voel je pijn."], ["Het paadje in het bos", "Hoe vaker pijn verwerkt wordt, hoe breder het pad. Nieuwe paden kunnen worden aangelegd."], ["Tuinieren", "Te veel water verdrinkt de plant, te weinig laat hem verwelken: dosering is de sleutel."], ["Pianospelen", "Het brein herprogrammeren vraagt oefening en herhaling, zoals een nieuwe vaardigheid."]]}, "tip": "Kies de metafoor die past bij de leefwereld van je patiënt."}, {"h": "Do's en don'ts", "twee": [{"k": "Wel doen", "l": ["Erkennen dat de pijn echt is", "Eenvoudige taal en beelden", "Vertrekken van de vragen van de patiënt", "Kleine porties, met checks", "Koppelen aan een concreet beweegdoel"]}, {"k": "Niet doen", "l": ["Een lezing geven zonder interactie", "'Het zit tussen je oren' suggereren", "Te veel neurofysiologisch jargon", "Alle beelden in één keer", "Educatie geven zonder vervolg in beweging"]}]}]}, {"type": "video", "blok": 5, "titel": "Een educatiegesprek in de praktijk", "youtube": "", "intro": "Een voorbeeld van een educatiegesprek         '<div class="vsteps">' + META.doelen.map(function (d) { return '<div class="vstep"><div class="n">' + icon('target', 20) + '</div><p>' + esc(d) + '</p></div>'; }).join('') + '</div>';
      setNext('Volgende', true);
    } else if (s.t === 'card') { pane.innerHTML = head(s) + cardBody(s.card); setNext('Volgende', true); }
    else if (s.t === 'video') {
      const v = s.step;
      pane.innerHTML = head(s) + '<p class="lede">' + esc(v.intro) + '</p>' + videoHtml(v) +
        (v.punten ? '<div class="card"><h4 class="ch">' + icon('list', 18) + ' In deze video</h4><ul class="vlist">' + v.punten.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '');
      setNext('Ik heb dit bekeken', true);
    } else if (s.t === 'q') renderQ(s);
    else if (s.t === 'refl') renderRefl(s);
    else if (s.t === 'casus') renderCasus(s);
    else if (s.t === 'widget') renderWidget(s);
    else if (s.t === 'toets') renderToets(s);
    else renderEnd(s);
  }

  function renderIntro() {
    const ks = Object.keys(D).filter(function (k) { return k !== '0'; });
    const counts = { video: 0, casus: 0, refl: 0, q: 0 };
    S.forEach(function (x) { if (counts[x.t] != null) counts[x.t]++; });
    const blist = ks.map(function (k) { return '<div class="vstep"><div class="n">' + k + '</div><div><h4>' + esc(D[k]) + '</h4>' + (META.blokinfo && META.blokinfo[k] ? '<p>' + esc(META.blokinfo[k]) + '</p>' : '') + '</div></div>'; }).join('');
    pane.innerHTML = '<span class="eyebrow">E-learning · Bijscholing kinesitherapie</span><h1>' + esc(META.titel) + '</h1><p class="lede">' + esc(META.lede) + '</p>' +
      '<div class="meta"><span>' + icon('clock', 16) + ' ' + esc(META.duur) + '</span><span>' + icon('medal', 16) + ' ' + esc(META.punten) + '</span><span>' + icon('list', 16) + ' Eindtoets, slagen vanaf 70%</span></div>' +
      '<div class="mix"><div><b>' + counts.video + '</b><span>video’s</span></div><div><b>' + counts.casus + '</b><span>casussen</span></div><div><b>' + counts.refl + '</b><span>reflecties</span></div><div><b>' + counts.q + '</b><span>kennisvragen</span></div></div>' +
      '<div class="howbox"><h3>Zo werkt deze module</h3><p>Je wisselt af tussen korte video’s, leesschermen met illustraties, casussen uit de praktijk, reflectievragen over je eigen patiënten en kennisvragen. Je sluit af met een eindtoets. Je voortgang wordt in deze browser bewaard, dus je kan altijd pauzeren en later verdergaan.</p></div>' +
      '<div class="vsteps" style="margin-top:28px">' + blist + '<div class="vstep"><div class="n">' + icon('medal', 20) + '</div><div><h4>Eindtoets</h4><p>Vragen over de hele module, je slaagt vanaf 70%.</p></div></div></div>' +
      '<p class="small">Klik op <b>Volgende</b> om te starten. Via het menu rechtsboven spring je naar elk onderdeel.</p>';
    setNext(cur === 0 && !st.seen[0] ? 'Start' : 'Volgende', true);
  }

  function renderQ(s) {
    const v = s.v, prevA = st.ans[s.id];
    pane.innerHTML = head(s) + '<div class="qnum">Vraag ' + s.n + ' van ' + s.of + '</div>' +
      '<div class="opts">' + v.a.map(function (a, i) { return '<button class="opt" data-i="' + i + '"><span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + esc(a) + '</span></button>'; }).join('') + '</div><div id="ex"></div>';
    const opts = pane.querySelectorAll('.opt');
    function show(i) {
      opts.forEach(function (o, j) { o.disabled = true; if (j === v.c) { o.classList.add('correct'); o.querySelector('.mk').innerHTML = icon('check', 14); } else if (j === i) { o.classList.add('wrong'); o.querySelector('.mk').innerHTML = icon('x', 14); } });
      const ok = i === v.c;
      document.getElementById('ex').innerHTML = '<div class="explain ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Juist. ' : 'Niet helemaal. ') + '</b>' + esc(v.u || '') + '</div>';
      setNext('Volgende', true);
    }
    opts.forEach(function (o) { o.addEventListener('click', function () { const i = +o.dataset.i; st.ans[s.id] = i; save(); show(i); }); });
    if (prevA != null) show(prevA); else setNext('Volgende', false);
  }

  function renderRefl(s) {
    const R = s.step, val = st.refl[s.id] || '';
    let h = head(s) + '<div class="reflq"><span class="cic">' + icon('pen', 20) + '</span><p>' + esc(R.vraag) + '</p></div>';
    if (R.toonVorige && firstRefl && st.refl[firstRefl.id]) h += '<div class="prevrefl"><div class="pl">Wat je in het begin schreef</div><p>' + esc(st.refl[firstRefl.id]) + '</p></div>';
    h += '<textarea class="ta" id="ta" rows="7" placeholder="Schrijf hier je antwoord…">' + esc(val) + '</textarea><div class="tameta"><span id="saved">' + (val ? 'Bewaard in je browser' : '') + '</span><span>± ' + (R.min || 5) + ' minuten</span></div>';
    if (R.tip) h += callout('tip', 'Tip', R.tip);
    pane.innerHTML = h;
    const ta = document.getElementById('ta');
    ta.addEventListener('input', function () { st.refl[s.id] = ta.value; save(); document.getElementById('saved').textContent = 'Bewaard in je browser'; });
    setNext('Volgende', true);
  }

  function renderCasus(s) {
    const C = s.step, prevA = st.cas[s.id];
    pane.innerHTML = head(s) + '<div class="casbox"><span class="cic">' + icon('user', 22) + '</span><p>' + esc(C.situatie) + '</p></div><div class="qnum" style="margin-top:22px">Kies de beste aanpak</div>' +
      '<div class="opts">' + C.opties.map(function (o, i) { return '<button class="opt" data-i="' + i + '"><span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o.t) + '</span></button>'; }).join('') + '</div><div id="ex"></div>';
    const opts = pane.querySelectorAll('.opt');
    function show(i) {
      const o = C.opties[i];
      opts.forEach(function (b, j) { b.classList.remove('correct', 'wrong'); b.querySelector('.mk').textContent = String.fromCharCode(65 + j); if (j === i) { b.classList.add(o.ok ? 'correct' : 'wrong'); b.querySelector('.mk').innerHTML = icon(o.ok ? 'check' : 'x', 14); } });
      document.getElementById('ex').innerHTML = '<div class="explain ' + (o.ok ? 'good' : 'bad') + '"><b>' + (o.ok ? 'Sterke keuze. ' : 'Denk nog even na. ') + '</b>' + esc(o.fb) + (o.ok ? '' : ' Probeer gerust een andere optie.') + '</div>';
      setNext('Volgende', true);
    }
    opts.forEach(function (b) { b.addEventListener('click', function () { const i = +b.dataset.i; st.cas[s.id] = i; save(); show(i); }); });
    if (prevA != null) show(prevA); else setNext('Volgende', false);
  }

  function renderWidget(s) {
    const W = s.step;
    pane.innerHTML = head(s) + '<p class="lede">' + esc(W.intro) + '</p><div class="card wid">' +
      '<label class="wl">Baseline (' + esc(W.eenheid) + ')<input type="range" id="wb" min="1000" max="10000" step="' + W.stap + '" value="' + W.start + '"><output id="wo"></output></label>' +
      '<label class="wl">Opbouw per week<select id="wp"><option value="5">5%</option><option value="10" selected>10%</option><option value="15">15%</option></select></label>' +
      '<div id="wc"></div></div>' + callout('tip', 'In de praktijk', 'Rond af naar haalbare getallen en noteer de weekdoelen vooraf in het schema van je patiënt. Bij een opflakkering zet je tijdelijk één week terug, je stopt niet.');
    const wb = document.getElementById('wb'), wp = document.getElementById('wp');
    function draw() {
      const b = +wb.value, p = +wp.value / 100, n = W.weken, vals = [];
      for (let i = 0; i < n; i++) vals.push(Math.round(b * Math.pow(1 + p, i) / 50) * 50);
      document.getElementById('wo').textContent = b.toLocaleString('nl-BE');
      const mx = Math.max.apply(null, vals) * 1.1, bw = 560 / n;
      let svg = '<svg viewBox="0 0 640 240" role="img" aria-label="Opbouwschema">';
      vals.forEach(function (v, i) { const h = v / mx * 180, x = 60 + i * bw; svg += '<rect x="' + (x + 6) + '" y="' + (200 - h) + '" width="' + (bw - 12) + '" height="' + h + '" rx="6" fill="' + (i === 0 ? '#1e2d4a' : '#3ecfb2') + '"/><text x="' + (x + bw / 2) + '" y="' + (192 - h) + '" font-size="12" font-weight="600" text-anchor="middle" fill="#1e2d4a">' + v.toLocaleString('nl-BE') + '</text><text x="' + (x + bw / 2) + '" y="222" font-size="12" text-anchor="middle" fill="#5b6577">week ' + (i + 1) + '</text>'; });
      svg += '</svg>';
      document.getElementById('wc').innerHTML = svg + '<p class="small" style="margin-top:6px">Na ' + n + ' weken: <b>' + vals[n - 1].toLocaleString('nl-BE') + '</b> ' + esc(W.eenheid) + ' (+' + Math.round((vals[n - 1] / vals[0] - 1) * 100) + '%).</p>';
    }
    wb.addEventListener('input', draw); wp.addEventListener('change', draw); draw();
    setNext('Volgende', true);
  }

  function renderToets(s) {
    const T = s.step, n = T.vragen.length, pass = T.slagen || 70;
    const req = S.map(function (x, i) { return i; }).filter(function (i) { const x = S[i]; return (x.t === 'q' && st.ans[x.id] == null) || (x.t === 'casus' && st.cas[x.id] == null) || (x.t === 'video' && !st.seen[i]); });
    if (req.length) {
      pane.innerHTML = head(s) + '<div class="card lock"><div class="cic" style="color:var(--muted)">' + icon('lock', 26) + '</div><div><h3 style="font-size:1.15rem">Nog even geduld</h3><p style="color:var(--muted);margin:6px 0 14px">Doorloop eerst alle video’s, casussen en kennisvragen. Daarna kan je de eindtoets afleggen. Nog ' + req.length + (req.length === 1 ? ' onderdeel' : ' onderdelen') + ' te gaan.</p><button class="btn btn-primary" id="goTodo">Ga naar het eerste open onderdeel ' + icon('arrow', 18) + '</button></div></div>';
      document.getElementById('goTodo').addEventListener('click', function () { go(req[0]); });
      setNext('Volgende', false); return;
    }
    let h = head(s) + '<p class="lede">' + n + ' vragen over de hele module. Je slaagt vanaf ' + pass + '%. Pas na het indienen zie je je score.</p>';
    if (st.toets && st.toets.geslaagd) h += '<div class="result pass"><div class="big">' + st.toets.score + '%</div><div><b>Al geslaagd</b> op ' + esc(st.toets.datum) + '. Je mag de toets opnieuw maken.</div></div>';
    T.vragen.forEach(function (v, qi) {
      h += '<div class="tq" data-q="' + qi + '"><div class="qnum">Vraag ' + (qi + 1) + ' van ' + n + '</div><h4>' + esc(v.q) + '</h4><div class="opts">' +
        v.a.map(function (a, i) { return '<button class="opt" data-i="' + i + '"><span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + esc(a) + '</span></button>'; }).join('') + '</div><div class="fb"></div></div>';
    });
    h += '<div class="tsubmit"><span id="cnt">0 / ' + n + ' beantwoord</span><button class="btn btn-primary" id="send" disabled>Toets indienen ' + icon('arrow', 18) + '</button></div><div id="res"></div>';
    pane.innerHTML = h;
    setNext('Naar de afronding', !!(st.toets && st.toets.geslaagd));
    const ans = {}; let locked = false; const send = document.getElementById('send');
    pane.querySelectorAll('.tq').forEach(function (q) {
      const qi = +q.dataset.q;
      q.querySelectorAll('.opt').forEach(function (o) {
        o.addEventListener('click', function () {
          if (locked) return;
          q.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          o.classList.add('sel'); ans[qi] = +o.dataset.i;
          const k = Object.keys(ans).length; document.getElementById('cnt').textContent = k + ' / ' + n + ' beantwoord'; send.disabled = k < n;
        });
      });
    });
    send.addEventListener('click', function () {
      locked = true; send.disabled = true; let good = 0;
      pane.querySelectorAll('.tq').forEach(function (q) {
        const qi = +q.dataset.q, ok = ans[qi] === T.vragen[qi].c; if (ok) good++;
        q.classList.add(ok ? 'ok' : 'nok'); q.querySelector('.fb').textContent = ok ? 'Juist' : 'Fout';
        q.querySelectorAll('.opt').forEach(function (o) { o.disabled = true; });
      });
      const score = Math.round(good / n * 100), ok = score >= pass, res = document.getElementById('res');
      if (ok) {
        st.toets = { geslaagd: true, score: score, datum: new Date().toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' }) }; save();
        res.innerHTML = '<div class="result pass"><div class="big">' + score + '%</div><div><b>Geslaagd!</b> Je beantwoordde ' + good + ' van ' + n + ' vragen juist.</div><button class="btn btn-primary" id="toEnd">Naar de afronding ' + icon('arrow', 18) + '</button></div>';
        document.getElementById('toEnd').addEventListener('click', function () { go(cur + 1); });
        setNext('Naar de afronding', true);
      } else {
        res.innerHTML = '<div class="result fail"><div class="big">' + score + '%</div><div><b>Nog niet geslaagd.</b> ' + good + ' van ' + n + ' juist; je hebt minstens ' + pass + '% nodig. Herbekijk gerust de delen via het menu en probeer opnieuw.</div><button class="btn btn-primary" id="retry">Opnieuw proberen</button></div>';
        document.getElementById('retry').addEventListener('click', function () { render(); scrollTo({ top: 0, behavior: 'smooth' }); });
      }
      res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  function renderEnd(s) {
    const t = st.toets;
    if (!t || !t.geslaagd) {
      pane.innerHTML = head(s) + '<p class="lede">Je bent bijna klaar. Leg eerst de eindtoets af om de module af te ronden.</p><div style="margin-top:22px"><button class="btn btn-primary" id="toToets">Naar de eindtoets ' + icon('arrow', 18) + '</button></div>';
      document.getElementById('toToets').addEventListener('click', function () { go(cur - 1); });
      setNext('Volgende', false); return;
    }
    pane.innerHTML = '<span class="eyebrow">Afsluiten</span><h1>Proficiat, je hebt de module afgerond</h1>' +
      '<div class="cert"><div class="seal">' + icon('medal', 30) + '</div><h3>' + esc(META.titel) + '</h3><p style="color:var(--muted);margin-top:6px">Geslaagd voor de eindtoets</p><div class="cm"><span>Score ' + t.score + '%</span><span>' + esc(t.datum) + '</span><span>' + esc(META.punten) + '</span></div></div>' +
      '<h3 style="margin-top:32px;font-size:1.25rem">Nog twee dingen</h3>' +
      '<div class="vsteps"><div class="vstep"><div class="n">1</div><div><h4>Voeg de navorming toe in je Pro-Q-Kine-portfolio</h4><p>Dat doe je zelf; wij hebben geen toegang tot je account. Via e-learning haal je maximaal 24 navormingseenheden per jaar.</p></div></div>' +
      '<div class="vstep"><div class="n">2</div><div><h4>Laat ons weten wat je ervan vond</h4><p>We zijn een jonge organisatie en sturen bij op basis van jullie feedback.</p></div></div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:26px"><a class="btn btn-primary" href="contact.html">Geef feedback ' + icon('arrow', 18) + '</a><a class="btn btn-ghost" href="elearnings.html">Alle e-learnings</a><button class="btn btn-ghost" id="restart">Opnieuw beginnen</button></div>';
    document.getElementById('restart').addEventListener('click', function () { st = { seen: {}, ans: {}, refl: {}, cas: {} }; save(); go(0); });
    setNext('Volgende', false);
  }

  render();
})();
</script>
</body>
</html>
