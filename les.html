<!DOCTYPE html>
<html lang="nl">
<head>
<meta name="robots" content="noindex" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colleo — Les</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>/* ===== Colleo — design system ===== */
:root {
  /* Brand */
  --navy: #1e2d4a;          /* primary (tweakable) */
  --accent: #3ecfb2;        /* accent (tweakable) */
  --accent-ink: #0f5e50;    /* readable text-on-light derived from accent */

  /* Warm neutrals */
  --bg: #f7f3ec;
  --bg-2: #efe9df;
  --surface: #ffffff;
  --ink: #1b2436;
  --muted: #5b6577;
  --hairline: rgba(30, 45, 74, 0.12);
  --hairline-soft: rgba(30, 45, 74, 0.07);

  /* Type */
  --font-display: "Bricolage Grotesque", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;

  /* Shape */
  --r-card: 22px;
  --r-pill: 999px;
  --r-sm: 12px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(27, 36, 54, 0.04), 0 2px 8px rgba(27, 36, 54, 0.05);
  --shadow-md: 0 12px 30px -12px rgba(27, 36, 54, 0.22);
  --shadow-lg: 0 30px 70px -30px rgba(27, 36, 54, 0.40);

  /* Layout */
  --maxw: 1180px;
  --gutter: clamp(20px, 5vw, 64px);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 92px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.04;
  margin: 0;
  color: var(--navy);
  text-wrap: balance;
}
p { margin: 0; text-wrap: pretty; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(64px, 9vw, 130px); }

/* eyebrow */
.eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--accent-ink);
}
.eyebrow::before {
  content: ""; width: 22px; height: 2px; border-radius: 2px;
  background: var(--accent);
}
.eyebrow.center::after {
  content: ""; width: 22px; height: 2px; border-radius: 2px; background: var(--accent);
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: none; border-radius: var(--r-pill);
  padding: 16px 26px; font-size: 1.02rem; font-weight: 600;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-md); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-accent { background: var(--accent); color: var(--navy); box-shadow: var(--shadow-md); }
.btn-accent:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-ghost {
  background: transparent; color: var(--navy);
  border: 1.5px solid var(--hairline); padding: 14.5px 24px;
}
.btn-ghost:hover { border-color: var(--navy); background: rgba(30,45,74,0.04); }
.btn-block { width: 100%; }
.btn .arr { transition: transform .16s ease; }
.btn:hover .arr { transform: translateX(3px); }

/* nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, background .2s ease;
}
.nav.scrolled { border-color: var(--hairline-soft); background: color-mix(in srgb, var(--bg) 92%, transparent); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
.brand { display: flex; align-items: center; gap: 11px; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--navy); letter-spacing: -0.03em; }
.brand .dot { width: 30px; height: 30px; border-radius: 9px; background: var(--navy); display: grid; place-items: center; color: var(--accent); font-size: 1.05rem; }
.nav-links { display: flex; align-items: center; gap: 34px; }
.nav-links a { font-weight: 500; color: var(--muted); font-size: 0.98rem; transition: color .15s; }
.nav-links a:hover { color: var(--navy); }
.nav-cta { display: flex; align-items: center; gap: 16px; }
.nav-login { font-weight: 600; font-size: 0.96rem; color: var(--navy); padding: 8px 4px; }
.nav-login:hover { color: var(--accent-ink); }
@media (max-width: 520px) { .nav-login { display: none; } }
@media (max-width: 860px) { .nav-links { display: none; } }

/* hero */
.hero { position: relative; overflow: hidden; }
.hero-grid {
  display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(32px, 5vw, 72px);
  align-items: center; padding-top: clamp(48px, 7vw, 90px); padding-bottom: clamp(56px, 8vw, 110px);
}
.hero h1 { font-size: clamp(2.7rem, 5.6vw, 4.5rem); }
.hero h1 .hl { color: var(--accent-ink); position: relative; white-space: nowrap; }
.hero .lede { margin-top: 26px; font-size: clamp(1.08rem, 1.6vw, 1.28rem); color: var(--muted); max-width: 33ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
.hero-note { margin-top: 18px; font-size: 0.92rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.hero-note .check { color: var(--accent-ink); }

/* hero visual */
.hero-visual { position: relative; }
.premie-card {
  background: var(--navy); color: #fff; border-radius: var(--r-card);
  padding: 30px 30px 26px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.premie-card::after {
  content: ""; position: absolute; inset: auto -40px -60px auto; width: 200px; height: 200px;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%);
}
.premie-card .lbl { font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; color: color-mix(in srgb, #fff 70%, transparent); }
.premie-card .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 5vw, 3.4rem); line-height: 1; margin-top: 8px; }
.premie-card .big small { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
.premie-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.16); position: relative; z-index: 1; }
.premie-row .col .k { font-size: 0.8rem; color: color-mix(in srgb, #fff 65%, transparent); }
.premie-row .col .v { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin-top: 3px; }
.premie-row .col .v.pos { color: var(--accent); }

.float-card {
  position: absolute; left: -28px; bottom: -58px; background: var(--surface);
  border-radius: 16px; box-shadow: var(--shadow-md); padding: 15px 18px;
  display: flex; align-items: center; gap: 13px; max-width: 240px;
}
.float-card .ic { width: 40px; height: 40px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.float-card .t { font-weight: 700; font-size: 0.95rem; color: var(--navy); }
.float-card .s { font-size: 0.82rem; color: var(--muted); }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-visual { margin-top: 22px; }
  .float-card { position: static; margin: 16px 0 0; max-width: none; width: fit-content; }
}

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hairline-soft); border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--hairline-soft); margin-top: 8px; }
.stat { background: var(--bg); padding: 26px 22px; text-align: center; }
.stat .num { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 3vw, 2.5rem); color: var(--navy); line-height: 1; }
.stat .num em { font-style: normal; color: var(--accent-ink); }
.stat .cap { font-size: 0.88rem; color: var(--muted); margin-top: 8px; }
@media (max-width: 680px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* generic section header */
.sec-head { max-width: 640px; margin-bottom: clamp(36px, 5vw, 60px); }
.sec-head.center { margin-inline: auto; text-align: center; }
.sec-head h2 { font-size: clamp(2rem, 3.8vw, 3rem); margin-top: 16px; }
.sec-head p { margin-top: 18px; font-size: 1.12rem; color: var(--muted); }

/* why cards */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.card {
  background: var(--surface); border-radius: var(--r-card); padding: 32px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--hairline-soft);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.card .ic { width: 52px; height: 52px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 20%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; margin-bottom: 20px; }
.card h3 { font-size: 1.4rem; }
.card p { margin-top: 11px; color: var(--muted); font-size: 1rem; }
@media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }

/* programma */
.prog { background: var(--bg-2); }
.prog-list { display: flex; flex-direction: column; gap: 14px; }
.prog-row {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 26px; align-items: center;
  background: var(--surface); border-radius: 18px; padding: 24px 28px;
  border: 1px solid var(--hairline-soft); box-shadow: var(--shadow-sm);
  transition: transform .16s ease, box-shadow .16s ease;
}
.prog-row:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.prog-row .idx { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: var(--accent-ink); }
.prog-row .body .topic { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--navy); }
.prog-row .body .desc { color: var(--muted); margin-top: 4px; font-size: 0.98rem; }
.prog-row .meta { text-align: right; }
.prog-row .meta .date { font-weight: 700; color: var(--navy); white-space: nowrap; }
.prog-row .meta .ne { font-size: 0.85rem; color: var(--accent-ink); font-weight: 600; margin-top: 3px; }
@media (max-width: 720px) {
  .prog-row { grid-template-columns: 50px 1fr; }
  .prog-row .meta { grid-column: 1 / -1; text-align: left; padding-top: 12px; border-top: 1px solid var(--hairline-soft); display: flex; gap: 16px; align-items: baseline; }
  .prog-row .meta .ne { margin-top: 0; }
}

/* voordeel */
.voordeel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(34px, 5vw, 70px); align-items: center; }
.calc { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-md); border: 1px solid var(--hairline-soft); padding: clamp(28px, 4vw, 42px); }
.calc-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--hairline-soft); }
.calc-row:first-of-type { padding-top: 0; }
.calc-row .lbl { color: var(--muted); font-size: 1rem; }
.calc-row .lbl b { display: block; color: var(--ink); font-weight: 600; font-size: 1.08rem; }
.calc-row .amt { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--navy); white-space: nowrap; }
.calc-row .amt.cost { color: var(--muted); }
.calc-row .amt.cost::before { content: "−"; margin-right: 2px; }
.calc-row .amt.gain { color: var(--accent-ink); }
.calc-row .amt.gain::before { content: "+"; margin-right: 1px; }
.calc-total { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 22px 24px; background: var(--navy); color: #fff; border-radius: 16px; }
.calc-total .lbl { font-weight: 600; font-size: 1.05rem; }
.calc-total .amt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 3.5vw, 2.5rem); color: var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 22px; height: 220px; margin-top: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 12px 12px 0 0; position: relative; transition: height .6s cubic-bezier(.2,.7,.2,1); }
.bar.cost { background: var(--bg-2); border: 1px solid var(--hairline); }
.bar.gain { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 75%, var(--navy))); }
.bar-col .cap { font-size: 0.9rem; color: var(--muted); text-align: center; }
.bar-col .cap b { display: block; color: var(--navy); font-family: var(--font-display); font-size: 1.15rem; }
@media (max-width: 860px) { .voordeel-grid { grid-template-columns: 1fr; } }

/* aanpak steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: step; }
.step { position: relative; }
.step .n { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--hairline); color: var(--navy); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.step h3 { font-size: 1.22rem; }
.step p { color: var(--muted); margin-top: 8px; font-size: 0.98rem; }
.step:not(:last-child) .n::after { content: ""; position: absolute; left: 46px; top: 23px; width: calc(100% - 46px - 20px); height: 1.5px; background: var(--hairline); }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } .step .n::after { display: none; } }
@media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }

/* merged aanpak + voordeel */
.merge-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(34px, 5vw, 70px); align-items: start; }
@media (max-width: 880px) { .merge-grid { grid-template-columns: 1fr; } }
.steps-vert { display: flex; flex-direction: column; }
.vstep { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 20px; padding-bottom: 30px; }
.vstep:last-child { padding-bottom: 0; }
.vstep .n { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--hairline); color: var(--navy); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: grid; place-items: center; box-shadow: var(--shadow-sm); z-index: 1; }
.vstep:not(:last-child)::before { content: ""; position: absolute; left: 23.5px; top: 48px; bottom: 6px; width: 1.5px; background: var(--hairline); }
.vstep .vbody h3 { font-size: 1.22rem; }
.vstep .vbody p { color: var(--muted); margin-top: 5px; font-size: 0.99rem; }
.calc-extras { display: grid; gap: 14px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--hairline-soft); }
.calc-extra { display: flex; gap: 13px; align-items: flex-start; }
.calc-extra .ce-ic { width: 40px; height: 40px; flex: none; border-radius: 11px; background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; }
.calc-extra .ce-t { font-weight: 700; color: var(--navy); font-size: 1rem; }
.calc-extra .ce-s { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

/* e-learnings */
.el-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 880px) { .el-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 580px) { .el-grid { grid-template-columns: 1fr; } }
.el-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: var(--r-card); padding: 26px; box-shadow: var(--shadow-sm); transition: transform .18s ease, box-shadow .18s ease; color: inherit; }
.el-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.el-more { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; color: var(--accent-ink); font-weight: 600; font-size: 0.92rem; }
.el-more svg { transition: transform .16s ease; }
.el-card:hover .el-more svg { transform: translateX(4px); }
.el-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.el-badge { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); padding: 5px 11px; border-radius: 999px; }
.el-pts { font-size: 0.82rem; font-weight: 600; color: var(--navy); }
.el-card h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.el-card p { color: var(--muted); margin-top: 10px; font-size: 0.98rem; flex: 1; }
.el-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hairline-soft); }
.el-meta { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.92rem; }
.el-price { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--navy); text-align: right; line-height: 1; }
.el-price small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.el-note { text-align: center; margin-top: 30px; color: var(--muted); font-size: 1rem; }
.el-note a { color: var(--accent-ink); font-weight: 600; }

/* final cta */
.cta-band { background: var(--navy); color: #fff; border-radius: clamp(22px, 4vw, 36px); padding: clamp(44px, 7vw, 84px) clamp(28px, 6vw, 80px); text-align: center; position: relative; overflow: hidden; }
.cta-band::before { content: ""; position: absolute; inset: -50% 30% auto -20%; height: 400px; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 40%, transparent), transparent 65%); pointer-events: none; }
.cta-band h2 { color: #fff; font-size: clamp(2.1rem, 4.5vw, 3.4rem); position: relative; }
.cta-band p { color: color-mix(in srgb, #fff 78%, transparent); font-size: 1.15rem; margin-top: 18px; max-width: 52ch; margin-inline: auto; position: relative; }
.cta-band .hero-cta { justify-content: center; position: relative; }
.cta-band .hero-note { justify-content: center; color: color-mix(in srgb, #fff 70%, transparent); }
.cta-band .hero-note .check { color: var(--accent); }

/* footer */
.footer { padding-block: 54px; border-top: 1px solid var(--hairline); }
.footer-inner { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; }
.footer .muted { color: var(--muted); font-size: 0.92rem; }
.footer-links { display: flex; gap: 26px; }
.footer-links a { color: var(--muted); font-size: 0.94rem; }
.footer-links a:hover { color: var(--navy); }

/* reveal on scroll */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(20,28,46,0.55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--surface); border-radius: var(--r-card); width: min(480px, 100%);
  box-shadow: var(--shadow-lg); padding: clamp(26px, 4vw, 40px); position: relative; animation: pop .25s cubic-bezier(.2,.8,.2,1);
  max-height: calc(100vh - 40px); overflow: auto;
}
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.modal .close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-2); color: var(--ink); display: grid; place-items: center; }
.modal .close:hover { background: var(--hairline); }
.modal h3 { font-size: 1.7rem; }
.modal .sub { color: var(--muted); margin-top: 8px; }
.field { margin-top: 18px; }
.field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 7px; color: var(--ink); }
.field input {
  width: 100%; padding: 13px 15px; border-radius: var(--r-sm); border: 1.5px solid var(--hairline);
  font-family: inherit; font-size: 1rem; background: var(--bg); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.modal .summary { margin-top: 18px; background: var(--bg-2); border-radius: var(--r-sm); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
.modal .summary .k { color: var(--muted); font-size: 0.92rem; }

/* ===== lesson page ===== */
.lesson { padding-block: 28px 90px; }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
.crumb a:hover { color: var(--navy); }
.lesson-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; align-items: start; }
@media (max-width: 940px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-head h1 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
.lesson-head .sub { color: var(--muted); margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.95rem; }

/* video placeholder */
.video-ph { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-card); overflow: hidden; margin-top: 18px;
  background: repeating-linear-gradient(135deg, var(--bg-2) 0 14px, color-mix(in srgb, var(--bg-2) 60%, var(--surface)) 14px 28px);
  border: 1px solid var(--hairline); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.video-ph .play { width: 76px; height: 76px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-md); transition: transform .16s; }
.video-ph:hover .play { transform: scale(1.06); }
.video-ph .tag { position: absolute; left: 16px; bottom: 14px; font-family: ui-monospace, monospace; font-size: 0.78rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 5px 10px; border-radius: 8px; }
.video-ph .dur { position: absolute; right: 16px; bottom: 14px; font-family: ui-monospace, monospace; font-size: 0.78rem; color: #fff; background: rgba(27,36,54,0.75); padding: 5px 10px; border-radius: 8px; }

/* tabs */
.tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--hairline); }
.tab { background: none; border: none; padding: 12px 16px; font-weight: 600; font-size: 0.98rem; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--navy); }
.tab.active { color: var(--navy); border-color: var(--accent); }
.tab-body { padding-top: 22px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fade .25s ease; }
.chapter-list, .mat-list { display: flex; flex-direction: column; gap: 10px; }
.chapter { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: 12px; }
.chapter .ci { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-2); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; font-family: var(--font-display); flex: none; }
.chapter .nm { font-weight: 600; color: var(--navy); }
.mat-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: 12px; }
.mat-item .mi { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.mat-item .nm { flex: 1; font-weight: 600; color: var(--navy); font-size: 0.96rem; }
.mat-item .dl { color: var(--accent-ink); font-weight: 600; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }

/* quiz */
.quiz-q { background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
.quiz-q .qh { font-weight: 700; color: var(--navy); font-size: 1.05rem; margin-bottom: 14px; display: flex; gap: 10px; }
.quiz-q .qh .qn { color: var(--accent-ink); font-family: var(--font-display); }
.quiz-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--hairline); border-radius: 11px; cursor: pointer; margin-top: 9px; transition: border-color .14s, background .14s; }
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt input { accent-color: var(--accent); width: 18px; height: 18px; }
.quiz-opt.correct { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.quiz-opt.wrong { border-color: #d98b8b; background: color-mix(in srgb, #d98b8b 12%, var(--surface)); }
.quiz-result { padding: 18px 20px; border-radius: 14px; margin-top: 6px; margin-bottom: 16px; font-weight: 600; }
.quiz-result.pass { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-ink); }
.quiz-result.fail { background: color-mix(in srgb, #d98b8b 16%, var(--surface)); color: #8a3030; }

/* lesson sidebar */
.lesson-side { position: sticky; top: 90px; }
.ls-card { background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: var(--r-card); box-shadow: var(--shadow-sm); padding: 22px; }
.ls-card h3 { font-size: 1.1rem; margin-bottom: 14px; }
.ls-status { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-2); border-radius: 12px; margin-bottom: 16px; }
.ls-status .si { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface); color: var(--muted); }
.ls-status.done .si { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent-ink); }
.ls-status .st { font-weight: 700; color: var(--navy); font-size: 0.96rem; }
.ls-status .sd { font-size: 0.84rem; color: var(--muted); }
.ls-nav { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.ls-nav a { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--hairline-soft); color: var(--navy); font-weight: 600; font-size: 0.92rem; transition: background .14s; }
.ls-nav a:hover { background: var(--bg-2); }
.ls-nav a.disabled { opacity: 0.4; pointer-events: none; }
.ls-nav a .dir { color: var(--muted); font-size: 0.8rem; font-weight: 500; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 14px 22px; border-radius: 999px; box-shadow: var(--shadow-lg); font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; z-index: 200; display: flex; align-items: center; gap: 10px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .ti { color: var(--accent); }

<script>/* Colleo — shared cursist data, progress + auth (vanilla, localStorage) */
window.Colleo = (function () {
  const KEY = "colleo_progress_v1";
  const AUTH = "colleo_auth_v1";

  // praktische info (uit jaarplan 2026)
  const meta = {
    year: 2026,
    doors: "18u30",
    time: "19u00 – ±22u00",
    duration: "3 – 3,5 uur",
    location: "Putte — Kine Hud of Bodyworld",
    format: "Fysiek of digitaal (opnames herbekijkbaar)",
    price: "810",
    premie: "2.550",
  };

  // ── curriculum: 5 avondsessies, elk 8 punten = 40 punten (jaarplan 2026) ──
  const curriculum = [
    { id: 1, topic: "Manuele Therapie Refresher: Cx en Tx", ne: 8, date: "4 mrt 2026", dur: "3 – 3,5u", format: "Fysiek/digitaal",
      desc: "Veilig en precies manipuleren van de cervicale en thoracale wervelzuil, van screening tot techniek.",
      lessons: ["Rode vlaggen & veiligheid", "3D-onderzoek: upslope en downslope", "7 kerntechnieken Cx en Tx"],
      materials: ["Slides — MT Refresher Cx/Tx (PDF)", "Techniekenhandout (PDF)", "Red flags checklist (PDF)"],
      quiz: [
        { q: "Wat hoort altijd vooraf te gaan aan cervicale manipulatie?", a: ["Screening op red flags en contra-indicaties", "Maximale eindrek", "Niets, je start meteen"], correct: 0 },
        { q: "Waarvoor staat een 'refresher' in dit kader?", a: ["Een volledig nieuwe opleiding", "Het opfrissen en verdiepen van bestaande kennis", "Enkel theorie zonder praktijk"], correct: 1 },
        { q: "Hoeveel punten levert deze sessie op?", a: ["4", "8", "12"], correct: 1 },
      ] },
    { id: 2, topic: "Personal finance for physios", ne: 8, date: "6 mei 2026", dur: "3 – 3,5u", format: "Fysiek/digitaal",
      desc: "Grip op je financiën als zelfstandige kinesitherapeut: structuur, pensioen en beleggen.",
      lessons: ["Eenmanszaak of BV", "Pensioen: VAPZ, POZ en IPT", "Beleggen: buffer, ETF's en vastgoed"],
      materials: ["Slides — Personal finance (PDF)", "Fiscale checklist (PDF)", "Budgetsjabloon (XLSX)"],
      quiz: [
        { q: "Waarom is financiële kennis relevant voor een kinesitherapeut?", a: ["Het is enkel voor boekhouders", "Als zelfstandige bepaal je mee je eigen rendabiliteit", "Het heeft geen invloed op je praktijk"], correct: 1 },
        { q: "Wat is een beroepskost?", a: ["Een privé-uitgave", "Een uitgave nodig voor je beroep, fiscaal aftrekbaar", "Een boete"], correct: 1 },
        { q: "Wat is een gezonde financiële gewoonte?", a: ["Alles op één rekening laten staan", "Periodiek reserveren voor belastingen en pensioen", "Nooit budgetteren"], correct: 1 },
      ] },
    { id: 3, topic: "Manuele Therapie Refresher: Lx en extremiteiten", ne: 8, date: "17 jun 2026", dur: "3 – 3,5u", format: "Fysiek/digitaal",
      desc: "Onderzoek en manipulatie van de lage rug, het bekken en de extremiteiten.",
      lessons: ["Rode vlaggen rug, bekken & extremiteiten", "Klinisch onderzoek & SIG-cluster", "12 kerntechnieken"],
      materials: ["Slides — MT Refresher Lx & extremiteiten (PDF)", "Techniekenhandout (PDF)", "Oefenschema (PDF)"],
      quiz: [
        { q: "Wat is essentieel bij lage-rugklachten?", a: ["Onderscheid maken tussen specifieke en aspecifieke klachten", "Altijd beeldvorming aanvragen", "Steeds bedrust adviseren"], correct: 0 },
        { q: "Manuele therapie werkt het best:", a: ["Als losstaande passieve behandeling", "Gecombineerd met actieve oefentherapie", "Enkel bij acute fase"], correct: 1 },
        { q: "Welke regio's komen in deze sessie aan bod?", a: ["Enkel de nek", "Lumbale wervelzuil en extremiteiten", "Enkel de schouder"], correct: 1 },
      ] },
    { id: 4, topic: "(Sport)voeding: gezondheid en prestatie", ne: 8, date: "16 sep 2026", dur: "3 – 3,5u", format: "Fysiek/digitaal",
      desc: "Voeding in functie van gezondheid, herstel en prestatie.",
      lessons: ["Energiesystemen & macronutriënten", "Voeding en herstel", "Praktische adviezen voor patiënten"],
      materials: ["Slides — (Sport)voeding (PDF)", "Voedingsrichtlijnen (PDF)", "Praktische adviesgids (PDF)"],
      quiz: [
        { q: "Welke rol speelt voeding bij revalidatie?", a: ["Geen enkele", "Ondersteunt herstel en weefselopbouw", "Vertraagt herstel"], correct: 1 },
        { q: "Wat is een kerntaak binnen ons beroep?", a: ["Patiënten correct doorverwijzen en adviseren binnen je competenties", "Diëten voorschrijven als arts", "Voeding negeren"], correct: 0 },
        { q: "Macronutriënten zijn:", a: ["Vitaminen en mineralen", "Koolhydraten, eiwitten en vetten", "Enkel water"], correct: 1 },
      ] },
    { id: 5, topic: "Communicatie & patiënteneducatie bij chronische pijn", ne: 8, date: "4 nov 2026", dur: "3 – 3,5u", format: "Fysiek/digitaal",
      desc: "Communiceren en eduqueren bij chronische pijn.",
      lessons: ["Pijnneurowetenschap", "Motiverende gespreksvoering", "Patiënteneducatie in de praktijk"],
      materials: ["Slides — Communicatie & pijneducatie (PDF)", "Gespreksgids (PDF)", "Educatiemateriaal patiënt (PDF)"],
      quiz: [
        { q: "Wat toont moderne pijneducatie aan patiënten?", a: ["Pijn = altijd weefselschade", "Pijn is complex en niet gelijk aan schade", "Pijn moet genegeerd worden"], correct: 1 },
        { q: "Wat kenmerkt motiverende gespreksvoering?", a: ["De patiënt overtuigen met autoriteit", "Samen met de patiënt motivatie tot verandering versterken", "Enkel instructies geven"], correct: 1 },
        { q: "Patiënteneducatie werkt het best:", a: ["Los van behandeling", "Geïntegreerd in actieve revalidatie", "Enkel via folders"], correct: 1 },
      ] },
  ];

  // ── accreditatieperiode 2025–2027 ──
  const period = { start: 2025, end: 2027, current: 2026, years: [2025, 2026, 2027] };
  const REQUIRED_NE = 40;

  // ── jaarcriteria: ELK kalenderjaar opnieuw te behalen (vóór 31 dec) ──
  const jaarcriteria = [
    { id: "verbetertraject", label: "Verbetertraject invullen", when: "Begin van het jaar", type: "check",
      help: "Bij de start van het jaar vul je de vragen van een verbetertraject in. Het onderwerp kies je vrij — laat je gerust inspireren door de checklist of een peer review. Wij helpen je op weg met een sjabloon." },
    { id: "navorming", label: "40 navormingseenheden behalen", when: "Vóór 31 dec", type: "ne",
      help: "Verzamel 40 NE via geaccrediteerde navorming. De 5 Colleo-avondsessies leveren elk 8 NE — samen exact 40. Je voortgang vult automatisch aan zodra je een sessie afrondt." },
    { id: "pr_vrij", label: "Peer review — vrij thema", when: "Vóór 31 dec", type: "check",
      help: "Eén intercollegiaal overleg met een onderwerp naar eigen keuze (niet het vastgelegde jaarthema). Colleo organiseert deze peer reviews; de data vind je in je bevestigingsmail." },
    { id: "pr_vast", label: "Peer review — vastgelegd thema", when: "Vóór 31 dec", type: "check",
      help: "Eén peer review met het door Pro-Q-Kine vastgelegde jaarthema, of de e-learning met vastgelegd thema. Ook dit organiseren wij voor jou." },
    { id: "evaluatie", label: "Evaluatie van het verbetertraject", when: "Vanaf 1 nov", type: "check",
      help: "Op het einde van het jaar (beschikbaar vanaf 1 november) vul je de evaluatie van je verbetertraject in via het Pro-Q-Kine evaluatieformulier." },
  ];

  // ── periodecriteria: éénmalig per periode (ten laatste 31 dec 2027) ──
  const periodecriteria = [
    { id: "checklist", label: "Checklist 'Praktijk' invullen", type: "check", managed: true,
      help: "Eénmalig per periode vul je de Pro-Q-Kine checklist 'Praktijk' in. Colleo begeleidt en regelt dit mee voor jou." },
    { id: "patienten", label: "10 patiëntenbevragingen", type: "count", target: 10, managed: true,
      help: "Eénmalig per periode stuur je een patiëntenbevraging uit; je hebt minstens 10 ingevulde enquêtes nodig. Colleo regelt het uitsturen en de opvolging voor jou." },
  ];

  // ── storage ──
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
  function sessionState(id) {
    const s = load();
    return (s.sessions && s.sessions[id]) || { watched: false, quizPassed: false, quizScore: null };
  }
  function setSessionState(id, patch) {
    const s = load();
    s.sessions = s.sessions || {};
    s.sessions[id] = Object.assign(sessionState(id), patch);
    save(s);
    return s.sessions[id];
  }
  function isSessionDone(id) {
    const st = sessionState(id);
    return st.quizPassed; // sessie telt mee zodra de kennistoets behaald is
  }
  function checkState(cid) { const s = load(); return !!(s.checks && s.checks[cid]); }
  function setCheck(cid, val) {
    const s = load(); s.checks = s.checks || {}; s.checks[cid] = !!val; save(s);
  }
  function countState(cid) { const s = load(); return (s.counts && s.counts[cid]) || 0; }
  function setCount(cid, val) {
    const s = load(); s.counts = s.counts || {}; s.counts[cid] = Math.max(0, val | 0); save(s);
  }

  function earnedNE() {
    return curriculum.reduce((sum, c) => sum + (isSessionDone(c.id) ? c.ne : 0), 0);
  }
  // is een criterium behaald?
  function isCritDone(c) {
    if (c.type === "ne") return earnedNE() >= REQUIRED_NE;
    if (c.type === "count") return countState(c.id) >= c.target;
    return checkState(c.id);
  }
  // 0..1 voortgang van een criterium (voor de progressbalk)
  function critFrac(c) {
    if (c.type === "ne") return Math.min(1, earnedNE() / REQUIRED_NE);
    if (c.type === "count") return Math.min(1, countState(c.id) / c.target);
    return checkState(c.id) ? 1 : 0;
  }

  // ── afgeleide voortgang ──
  function progress() {
    const ne = earnedNE();
    const jaarFrac = jaarcriteria.reduce((s, c) => s + critFrac(c), 0) / jaarcriteria.length;
    const jaarDone = jaarcriteria.filter(isCritDone).length;
    const periodeDone = periodecriteria.filter(isCritDone).length;
    const periodeFrac = periodecriteria.reduce((s, c) => s + critFrac(c), 0) / periodecriteria.length;
    const sessionsDone = curriculum.filter((c) => isSessionDone(c.id)).length;
    return {
      earnedNE: ne, requiredNE: REQUIRED_NE,
      sessionsDone, sessionsTotal: curriculum.length,
      jaarDone, jaarTotal: jaarcriteria.length,
      periodeDone, periodeTotal: periodecriteria.length,
      pct: Math.round(jaarFrac * 100),
      periodePct: Math.round(periodeFrac * 100),
      jaarComplete: jaarDone === jaarcriteria.length,
      periodeComplete: periodeDone === periodecriteria.length,
      complete: jaarDone === jaarcriteria.length && periodeDone === periodecriteria.length,
    };
  }

  // ── auth (prototype) ──
  function getUser() { try { return JSON.parse(localStorage.getItem(AUTH)); } catch (e) { return null; } }
  function setUser(u) { localStorage.setItem(AUTH, JSON.stringify(u)); }
  function logout() { localStorage.removeItem(AUTH); try { fetch('/api/logout', { method: 'POST', keepalive: true }); } catch (e) {} }
  function requireAuth() {
    if (!getUser()) { location.href='login.html'; return false; }
    return true;
  }

  function initials(name) {
    return (name || "Cursist").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  }

  return {
    curriculum, jaarcriteria, periodecriteria, period, meta, REQUIRED_NE,
    sessionState, setSessionState, isSessionDone,
    checkState, setCheck, countState, setCount,
    earnedNE, isCritDone, critFrac, progress,
    getUser, setUser, logout, requireAuth, initials,
  };
})();
</script>
<script>/* Colleo — tiny shared UI helpers for portal pages */
(function () {
  const P = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    arrow: `<path ${P} d="M5 12h14M13 6l6 6-6 6"/>`,
    arrowL: `<path ${P} d="M19 12H5M11 6l-6 6 6 6"/>`,
    check: `<path ${P} d="m5 13 4 4 10-11"/>`,
    play: `<path fill="currentColor" d="M8 5.5v13l11-6.5z"/>`,
    doc: `<path ${P} d="M7 3h7l5 5v13H7z"/><path ${P} d="M14 3v5h5M10 13h6M10 17h6"/>`,
    download: `<path ${P} d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"/>`,
    lock: `<rect ${P} x="5" y="11" width="14" height="9" rx="2"/><path ${P} d="M8 11V8a4 4 0 0 1 8 0v3"/>`,
    medal: `<circle ${P} cx="12" cy="14" r="6"/><path ${P} d="M9 9 7 3h10l-2 6"/><path ${P} d="m12 11.5 1 2 2 .3-1.5 1.5.4 2.2L12 17.5l-1.9 1.2.4-2.2L9 15l2-.5 1-2Z"/>`,
    chevron: `<path ${P} d="m9 6 6 6-6 6"/>`,
    logout: `<path ${P} d="M15 12H4m0 0 4-4m-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>`,
    clock: `<circle ${P} cx="12" cy="12" r="9"/><path ${P} d="M12 7v5l3 2"/>`,
    calendar: `<rect ${P} x="3.5" y="5" width="17" height="16" rx="2.5"/><path ${P} d="M3.5 10h17M8 3v4M16 3v4"/>`,
    book: `<path ${P} d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM19 18v3H6a2 2 0 0 1-2-2"/>`,
    phone: `<path ${P} d="M6.5 3h3l1.5 5-2 1.5a12 12 0 0 0 5 5l1.5-2 5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5a2 2 0 0 1 2-2z"/>`,
    list: `<path ${P} d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>`,
    spark: `<path ${P} d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>`,
  };
  function icon(name, size) {
    size = size || 22;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  }
  let toastEl = null, toastT = null;
  function toast(msg, iconName) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.innerHTML = (iconName ? `<span class="ti">${icon(iconName, 20)}</span>` : '') + `<span>${msg}</span>`;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  window.UI = { icon, toast, esc };
})();
</script>
<script>
if (Colleo.requireAuth()) {
  const icon = UI.icon, esc = UI.esc;
  const user = Colleo.getUser();
  document.getElementById('uAv').textContent = Colleo.initials(user.name);
  document.getElementById('crsep').innerHTML = icon('chevron', 14);
  const lo = document.getElementById('logout');
  lo.innerHTML = icon('logout', 20);
  lo.addEventListener('click', function () { Colleo.logout(); location.href='login.html'; });
  document.getElementById('play').innerHTML = icon('play', 30);

  const id = parseInt(new URLSearchParams(window.__qs || location.search).get('s'), 10) || 1;
  const c = Colleo.curriculum.find(function (x) { return x.id === id; }) || Colleo.curriculum[0];

  // header
  document.title = 'Colleo — ' + c.topic;
  document.getElementById('crNow').textContent = 'Sessie ' + String(c.id).padStart(2, '0');
  document.getElementById('lTopic').textContent = c.topic;
  document.getElementById('lMeta').innerHTML =
    '<span>' + icon('calendar', 16) + ' ' + esc(c.date) + '</span>' +
    '<span>' + icon('clock', 16) + ' ' + esc(c.dur) + '</span>' +
    '<span>' + c.ne + ' navormingseenheden</span>';
  document.getElementById('vtag').textContent = 'VIDEO — Sessie ' + String(c.id).padStart(2, '0') + ' (placeholder)';
  document.getElementById('vdur').textContent = c.dur;

  // mark video watched on "play"
  document.getElementById('video').addEventListener('click', function () {
    Colleo.setSessionState(c.id, { watched: true });
    UI.toast('Video gestart — ga verder met de kennistoets', 'play');
    renderStatus();
  });

  // chapters
  document.getElementById('chapters').innerHTML = c.lessons.map(function (l, i) {
    return '<div class="chapter"><div class="ci">' + (i + 1) + '</div><div class="nm">' + esc(l) + '</div></div>';
  }).join('');

  // materials
  document.getElementById('materials').innerHTML = c.materials.map(function (m) {
    return '<div class="mat-item"><div class="mi">' + icon('doc', 20) + '</div><div class="nm">' + esc(m) +
      '</div><a class="dl" href="#" data-dl="' + esc(m) + '">' + icon('download', 16) + ' Download</a></div>';
  }).join('');
  document.querySelectorAll('[data-dl]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); UI.toast('Download gestart (demo)', 'download'); });
  });

  // ── quiz ──
  function renderQuiz() {
    const st = Colleo.sessionState(c.id);
    const area = document.getElementById('quizArea');
    if (st.quizPassed) {
      area.innerHTML = '<div class="quiz-result pass">' + icon('check', 18) +
        ' Je hebt de kennistoets behaald (' + st.quizScore + '/' + c.quiz.length + '). Deze sessie telt mee voor ' + c.ne + ' eenheden.</div>' +
        '<button class="btn btn-ghost" id="retry">Toets opnieuw maken</button>';
      document.getElementById('retry').addEventListener('click', function () {
        Colleo.setSessionState(c.id, { quizPassed: false, quizScore: null });
        renderQuiz(); renderStatus();
      });
      return;
    }
    let html = '<p style="color:var(--muted);margin-bottom:18px">Beantwoord de vragen om de sessie af te ronden. Je hebt minstens ' +
      (c.quiz.length - 1) + ' van de ' + c.quiz.length + ' juist nodig.</p>';
    c.quiz.forEach(function (q, qi) {
      html += '<div class="quiz-q" data-q="' + qi + '"><div class="qh"><span class="qn">' + (qi + 1) + '.</span><span>' + esc(q.q) + '</span></div>';
      q.a.forEach(function (opt, oi) {
        html += '<label class="quiz-opt"><input type="radio" name="q' + qi + '" value="' + oi + '"><span>' + esc(opt) + '</span></label>';
      });
      html += '</div>';
    });
    html += '<button class="btn btn-primary" id="submitQuiz" style="margin-top:6px">Toets indienen</button>';
    area.innerHTML = html;
    document.getElementById('submitQuiz').addEventListener('click', gradeQuiz);
  }

  function gradeQuiz() {
    let score = 0, answered = 0;
    c.quiz.forEach(function (q, qi) {
      const sel = document.querySelector('input[name="q' + qi + '"]:checked');
      const block = document.querySelector('[data-q="' + qi + '"]');
      block.querySelectorAll('.quiz-opt').forEach(function (o) { o.classList.remove('correct', 'wrong'); });
      if (sel) {
        answered++;
        const oi = parseInt(sel.value, 10);
        const optEl = block.querySelectorAll('.quiz-opt')[oi];
        if (oi === q.correct) { score++; optEl.classList.add('correct'); }
        else { optEl.classList.add('wrong'); block.querySelectorAll('.quiz-opt')[q.correct].classList.add('correct'); }
      }
    });
    if (answered < c.quiz.length) { UI.toast('Beantwoord eerst alle vragen', 'spark'); return; }
    const pass = score >= c.quiz.length - 1;
    const area = document.getElementById('quizArea');
    const res = document.createElement('div');
    res.className = 'quiz-result ' + (pass ? 'pass' : 'fail');
    res.innerHTML = (pass ? icon('check', 18) + ' Geslaagd! ' : '') + 'Je scoorde ' + score + '/' + c.quiz.length +
      (pass ? '. Deze sessie is voltooid.' : '. Je hebt minstens ' + (c.quiz.length - 1) + ' juist nodig — probeer opnieuw.');
    area.insertBefore(res, area.firstChild);
    Colleo.setSessionState(c.id, { watched: true, quizPassed: pass, quizScore: score });
    renderStatus();
    if (pass) UI.toast('Sessie voltooid — ' + c.ne + ' eenheden behaald!', 'check');
  }

  // ── status + nav ──
  function renderStatus() {
    const st = Colleo.sessionState(c.id);
    const done = st.quizPassed;
    const box = document.getElementById('lsStatus');
    box.className = 'ls-status' + (done ? ' done' : '');
    document.getElementById('lsIcon').innerHTML = icon(done ? 'check' : (st.watched ? 'play' : 'book'), 20);
    document.getElementById('lsTitle').textContent = done ? 'Voltooid' : (st.watched || st.quizScore != null ? 'Bezig' : 'Niet gestart');
    document.getElementById('lsDesc').textContent = done ? c.ne + ' eenheden behaald' : 'Rond de kennistoets af om te voltooien';
    const mark = document.getElementById('markBtn');
    if (done) {
      mark.className = 'btn btn-accent btn-block';
      mark.innerHTML = icon('check', 18) + ' Voltooid';
      mark.onclick = function () { document.querySelector('.tab[data-tab="toets"]').click(); };
    } else {
      mark.className = 'btn btn-primary btn-block';
      mark.innerHTML = 'Ga naar de kennistoets ' + icon('arrow', 18);
      mark.onclick = function () { document.querySelector('.tab[data-tab="toets"]').click(); window.scrollTo({ top: document.getElementById('tabs').offsetTop - 80, behavior: 'smooth' }); };
    }
  }

  function renderNav() {
    const prev = Colleo.curriculum.find(function (x) { return x.id === c.id - 1; });
    const next = Colleo.curriculum.find(function (x) { return x.id === c.id + 1; });
    const nav = document.getElementById('lsNav');
    nav.innerHTML =
      (prev ? '<a href="les.html?s=' + prev.id + '">' + icon('arrowL', 16) + '<span><span class="dir">Vorige</span><br>' + esc(prev.topic) + '</span></a>'
            : '<a class="disabled">' + icon('arrowL', 16) + '<span class="dir">Eerste sessie</span></a>') +
      (next ? '<a href="les.html?s=' + next.id + '"><span style="text-align:right"><span class="dir">Volgende</span><br>' + esc(next.topic) + '</span>' + icon('arrow', 16) + '</a>'
            : '<a href="portaal.html"><span class="dir">Terug naar overzicht</span>' + icon('arrow', 16) + '</a>');
  }

  // tabs
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.tab-pane').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.querySelector('[data-pane="' + t.dataset.tab + '"]').classList.add('active');
    });
  });

  renderQuiz(); renderStatus(); renderNav();
}
</script>
<script id="colleo-nav-js">
(function () {
  var ICON_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  var ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  function ensure() {
    var cta = document.querySelector('.nav .nav-cta');
    if (!cta || !document.querySelector('.nav .nav-links') || cta.querySelector('.nav-burger')) return;
    var b = document.createElement('button');
    b.className = 'nav-burger'; b.type = 'button'; b.setAttribute('aria-label', 'Menu openen'); b.innerHTML = ICON_OPEN;
    b.addEventListener('click', function () {
      var open = document.body.classList.toggle('menu-open');
      b.innerHTML = open ? ICON_CLOSE : ICON_OPEN; b.setAttribute('aria-label', open ? 'Menu sluiten' : 'Menu openen');
    });
    cta.appendChild(b);
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.nav-links a')) document.body.classList.remove('menu-open');
  });
  ensure();
  new MutationObserver(ensure).observe(document.body, { childList: true, subtree: true });
})();
</script>
