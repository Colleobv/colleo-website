<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Colleo — Statistieken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1e2d4a; --accent:#3ecfb2; --accent-ink:#0f5e50;
    --bg:#f7f3ec; --surface:#fff; --surface-2:#fbf9f5; --ink:#1b2436; --muted:#5b6577; --faint:#8a93a3;
    --hairline:rgba(30,45,74,.12); --grid:rgba(30,45,74,.08);
    --s1:#3b5998; --s2:#1f9e86; --bar:#1f9e86; --bar-soft:rgba(31,158,134,.14);
    --up:#0f7a55; --down:#b42318; --danger:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131b2b; --surface:#1c2639; --surface-2:#18213220; --ink:#eef1f6; --muted:#a3adbf; --faint:#7d879a;
      --hairline:rgba(255,255,255,.12); --grid:rgba(255,255,255,.07); --accent-ink:#3ecfb2;
      --s1:#6a86d4; --s2:#22a487; --bar:#22a487; --bar-soft:rgba(34,164,135,.18); --up:#4fd1a5; --down:#ff8a80; --danger:#ff8a80; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Hanken Grotesk",system-ui,sans-serif; font-size:15px; line-height:1.5; min-height:100vh; }
  h1,h2,h3 { font-family:"Bricolage Grotesque",Georgia,serif; letter-spacing:-.015em; font-weight:600; }
  button, input, select { font:inherit; color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px 64px; }
  @media (max-width:600px) { .wrap { padding:0 16px 48px; } }

  /* top */
  header.top { display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; padding:22px 0 18px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Bricolage Grotesque",Georgia,serif; font-weight:700; font-size:22px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--accent); }
  .brand small { font-family:"Hanken Grotesk",sans-serif; font-weight:500; font-size:15px; color:var(--muted); margin-left:4px; }
  .live { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--hairline); padding:5px 11px; border-radius:999px; }
  .live i { width:8px; height:8px; border-radius:50%; background:var(--faint); }
  .live.on i { background:var(--accent); box-shadow:0 0 0 0 rgba(62,207,178,.6); animation:pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(62,207,178,0); } 100% { box-shadow:0 0 0 0 rgba(62,207,178,0); } }
  .spacer { flex:1; }
  .ranges { display:flex; flex-wrap:wrap; gap:4px; background:var(--surface); border:1px solid var(--hairline); border-radius:999px; padding:4px; }
  .ranges button { border:0; background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:600; color:var(--muted); }
  .ranges button[aria-pressed="true"] { background:var(--navy); color:#fff; }
  @media (prefers-color-scheme: dark) { .ranges button[aria-pressed="true"] { background:var(--accent); color:#0b1a17; } }
  .custom { display:none; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .custom.show { display:flex; }
  .custom input { border:1px solid var(--hairline); background:var(--surface); border-radius:10px; padding:5px 8px; }
  .iconbtn { border:1px solid var(--hairline); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .iconbtn:hover { color:var(--ink); }

  /* cards */
  .card { background:var(--surface); border:1px solid var(--hairline); border-radius:20px; padding:22px 22px 20px; }
  .card h2 { font-size:19px; margin-bottom:4px; }
  .card .sub { color:var(--muted); font-size:13.5px; margin-bottom:16px; }
  .grid { display:grid; gap:16px; }
  .kpis { grid-template-columns:repeat(4,1fr); margin-bottom:16px; }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(2,1fr); } }
  .kpi { padding:18px 20px; }
  .kpi .lab { font-size:13px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .kpi .lab .sw { width:10px; height:3px; border-radius:2px; }
  .kpi .val { font-family:"Bricolage Grotesque",Georgia,serif; font-size:34px; font-weight:600; letter-spacing:-.02em; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .kpi .delta { font-size:13px; font-weight:600; color:var(--muted); }
  .delta.up { color:var(--up); } .delta.down { color:var(--down); }
  .two { grid-template-columns:1fr 1fr; }
  .three { grid-template-columns:repeat(3,1fr); }
  @media (max-width:900px) { .two, .three { grid-template-columns:1fr; } }
  section { margin-top:16px; }
  .sectionhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin:34px 0 12px; }
  .sectionhead h2 { font-size:24px; }
  .sectionhead p { color:var(--muted); font-size:14px; }

  /* charts */
  .chart { position:relative; }
  .chart svg { display:block; width:100%; height:auto; overflow:visible; }
  .legend { display:flex; gap:16px; font-size:13px; color:var(--muted); margin-bottom:8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:14px; height:3px; border-radius:2px; display:inline-block; }
  .tip { position:absolute; pointer-events:none; background:var(--navy); color:#fff; border-radius:10px; padding:8px 11px; font-size:12.5px; line-height:1.45; white-space:nowrap; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); transform:translate(-50%,calc(-100% - 12px)); opacity:0; transition:opacity .12s; z-index:5; }
  @media (prefers-color-scheme: dark) { .tip { background:#eef1f6; color:#131b2b; } }
  .tip.show { opacity:1; }
  .tip b { font-weight:700; }
  .tip .row { display:flex; align-items:center; gap:6px; }
  .tip .row i { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* tables */
  .tablewrap { overflow-x:auto; margin:0 -6px; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:right; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:8px 6px; border-bottom:1px solid var(--hairline); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th button { border:0; background:none; font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer; padding:0; }
  th button[aria-sort]::after { content:" ↓"; }
  td { text-align:right; padding:9px 6px; border-bottom:1px solid var(--grid); white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  td.page { white-space:normal; min-width:200px; }
  td.page .p { font-weight:600; }
  td.page .u { color:var(--faint); font-size:12.5px; }
  .tbar { display:inline-flex; align-items:center; gap:8px; justify-content:flex-end; }
  .tbar .b { height:6px; border-radius:3px; background:var(--bar); min-width:2px; }
  .tbar .track { width:80px; display:flex; justify-content:flex-start; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--bar-soft); color:var(--accent-ink); margin-left:6px; vertical-align:1px; }

  /* bar lists */
  .blist { list-style:none; padding:0; display:grid; gap:7px; }
  .blist li { position:relative; display:flex; justify-content:space-between; gap:12px; padding:6px 10px; border-radius:8px; font-size:14px; z-index:0; }
  .blist li .fill { position:absolute; inset:0 auto 0 0; background:var(--bar-soft); border-radius:8px; z-index:-1; }
  .blist li .k { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .blist li .n { font-weight:700; font-variant-numeric:tabular-nums; }
  .empty { color:var(--faint); font-size:14px; padding:8px 0; }

  /* e-learning */
  .mod { margin-top:16px; }
  .modhead { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .modstats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:800px) { .modstats { grid-template-columns:repeat(2,1fr); } }
  .ms { background:var(--bg); border-radius:14px; padding:12px 14px; }
  .ms .l { font-size:12.5px; color:var(--muted); font-weight:600; }
  .ms .v { font-family:"Bricolage Grotesque",Georgia,serif; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ms .v small { font-family:"Hanken Grotesk",sans-serif; font-size:13px; color:var(--muted); font-weight:600; margin-left:4px; }
  .screens td.page { min-width:240px; }
  .typ { display:inline-block; width:64px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); }
  .funnel { display:inline-flex; align-items:center; gap:8px; }
  .funnel .track { width:120px; height:8px; border-radius:4px; background:var(--grid); overflow:hidden; }
  .funnel .b { height:100%; background:var(--bar); border-radius:4px; }
  details.more summary { cursor:pointer; color:var(--accent-ink); font-weight:600; font-size:14px; margin-top:10px; }

  /* login / states */
  .login { min-height:80vh; display:grid; place-items:center; }
  .login .card { width:100%; max-width:400px; padding:36px 30px 30px; box-shadow:0 30px 70px -30px rgba(27,36,54,.4); }
  .login h1 { font-size:22px; margin:24px 0 6px; }
  .login p { color:var(--muted); font-size:15px; }
  .login label { display:block; font-weight:600; font-size:14px; margin:20px 0 8px; }
  .login input[type=password] { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--hairline); background:transparent; }
  .login input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .login .chk { display:flex; align-items:center; gap:8px; font-weight:500; font-size:14px; color:var(--muted); margin-top:12px; }
  .login button { width:100%; margin-top:16px; font-weight:600; font-size:16px; padding:12px; border:0; border-radius:999px; background:var(--navy); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { .login button { background:var(--accent); color:#0b1a17; } }
  .err { color:var(--danger); font-size:14px; font-weight:500; margin-top:12px; }
  .notice { background:var(--surface); border:1px solid var(--hairline); border-left:4px solid var(--accent); border-radius:14px; padding:16px 18px; margin:8px 0 16px; }
  .notice h3 { font-size:17px; margin-bottom:4px; }
  .notice p, .notice li { color:var(--muted); font-size:14px; }
  .notice ol { padding-left:20px; margin-top:6px; }
  .notice code { background:var(--bg); padding:1px 5px; border-radius:5px; font-size:13px; }
  .loading { opacity:.55; transition:opacity .2s; }
  footer { margin-top:40px; color:var(--faint); font-size:13px; display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:space-between; }
  footer label { display:inline-flex; gap:7px; align-items:center; cursor:pointer; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var KEY = 'colleo_stats_pw';
  var pw = null;
  try { pw = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) {}
  var range = { preset: '30', from: null, to: null };
  try { var r = sessionStorage.getItem('colleo_stats_range'); if (r) range = JSON.parse(r); } catch (e) {}
  var data = null, pageSort = 'uv';

  var NAMES = {
    '/': 'Home', '/programma': 'Programma', '/over-ons': 'Over ons', '/contact': 'Contact', '/faq': 'Veelgestelde vragen',
    '/elearnings': 'E-learnings (overzicht)', '/elearning': 'E-learning', '/elearning-pijn': 'E-learning Complexe pijn',
    '/elearning-finance': 'E-learning Finance for physios', '/elearning-voeding': 'E-learning Voeding', '/lesgever': 'Lesgever',
    '/les': 'Les', '/login': 'Login', '/portaal': 'Portaal', '/privacy': 'Privacy', '/voorwaarden': 'Voorwaarden'
  };
  var TYPES = { intro: 'Start', doelen: 'Doelen', card: 'Lezen', video: 'Video', q: 'Vraag', refl: 'Reflectie', casus: 'Casus', widget: 'Oefening', toets: 'Toets', feedback: 'Feedback', end: 'Einde' };

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var nf = new Intl.NumberFormat('nl-BE');
  function num(n) { return nf.format(Math.round(n || 0)); }
  function dur(ms) {
    if (!ms || ms < 1000) return '–';
    var s = Math.round(ms / 1000);
    if (s < 60) return s + ' s';
    var m = Math.floor(s / 60), r = s % 60;
    if (m < 60) return m + ' min ' + (r < 10 ? '0' : '') + r + ' s';
    return Math.floor(m / 60) + ' u ' + (m % 60) + ' min';
  }
  function pageName(p) { return NAMES[p] || p; }
  function fmtDay(d, long) { var dt = new Date(d + 'T12:00:00Z'); return dt.toLocaleDateString('nl-BE', long ? { weekday: 'short', day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }); }
  var countryNames = null;
  try { countryNames = new Intl.DisplayNames(['nl'], { type: 'region' }); } catch (e) {}
  function country(c) { if (!c || c === '?' || c === 'XX' || c === 'T1') return 'Onbekend'; try { return countryNames ? countryNames.of(c) : c; } catch (e) { return c; } }
  function todayBE() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Brussels' }); }
  function addDays(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }

  function rangeDates() {
    var t = todayBE();
    if (range.preset === 'custom' && range.from && range.to) return { from: range.from, to: range.to };
    if (range.preset === 'today') return { from: t, to: t };
    if (range.preset === '365') return { from: addDays(t, -364), to: t };
    return { from: addDays(t, -(parseInt(range.preset, 10) || 30) + 1), to: t };
  }

  // ───── login ─────
  function showLogin(msg) {
    app.innerHTML = '<div class="login"><form class="card" id="lf">' +
      '<div class="brand"><span class="dot"></span>Colleo</div>' +
      '<h1>Statistieken</h1><p>Cookievrije bezoekerscijfers van colleo.be en de e-learnings.</p>' +
      '<label for="pw">Wachtwoord</label><input id="pw" type="password" autocomplete="current-password" required autofocus>' +
      '<label class="chk"><input type="checkbox" id="rem"> Onthoud op dit toestel</label>' +
      '<button type="submit">Bekijken</button>' + (msg ? '<p class="err" role="alert">' + esc(msg) + '</p>' : '') + '</form></div>';
    document.getElementById('lf').addEventListener('submit', function (e) {
      e.preventDefault();
      pw = document.getElementById('pw').value;
      var rem = document.getElementById('rem').checked;
      try { sessionStorage.setItem(KEY, pw); if (rem) localStorage.setItem(KEY, pw); } catch (er) {}
      load(true);
    });
  }
  function logout() { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} pw = null; showLogin(); }

  // ───── data ─────
  function load(first) {
    if (!pw) return showLogin();
    var rd = rangeDates();
    var main = document.getElementById('main'); if (main) main.classList.add('loading');
    fetch('/api/stats?from=' + rd.from + '&to=' + rd.to, { headers: { Authorization: 'Bearer ' + pw }, cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return { error: 'http', status: r.status }; }).then(function (j) { j.__status = r.status; return j; }); })
      .then(function (j) {
        if (j.error === 'auth') { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} pw = null; return showLogin(first ? 'Dat wachtwoord klopt niet.' : 'Je sessie is verlopen. Log opnieuw in.'); }
        if (j.error === 'no_password') return showSetup('pw');
        if (j.error === 'no_db') return showSetup('db');
        if (j.error) return showSetup('api', j.__status);
        data = j; render();
      })
      .catch(function () { showSetup('api'); });
  }

  function showSetup(kind, status) {
    var steps = '<ol>' +
      '<li>Cloudflare dashboard → <b>Storage &amp; databases → D1</b> → <b>Create database</b>, naam <code>colleo-stats</code>.</li>' +
      '<li>Workers &amp; Pages → project <b>colleo</b> → <b>Settings → Bindings</b> → <b>Add → D1 database</b>: variabele <code>STATS_DB</code>, database <code>colleo-stats</code>.</li>' +
      '<li>Settings → <b>Variables and Secrets</b> → voeg <code>STATS_PASSWORD</code> toe (type Secret).</li>' +
      '<li>Deployments → laatste deploy → <b>Retry deployment</b>. De tabellen worden automatisch aangemaakt.</li></ol>';
    var msg = kind === 'pw' ? 'Er is nog geen <code>STATS_PASSWORD</code> ingesteld.' : kind === 'db' ? 'De database <code>STATS_DB</code> is nog niet gekoppeld.' : 'De statistieken-API antwoordt niet' + (status ? ' (status ' + status + ')' : '') + '. Staat de laatste versie online?';
    app.innerHTML = '<header class="top"><div class="brand"><span class="dot"></span>Colleo<small>Statistieken</small></div></header>' +
      '<div class="notice"><h3>Nog één keer instellen</h3><p>' + msg + '</p>' + steps + '</div>' +
      '<button class="iconbtn" id="retry">Opnieuw proberen</button>';
    document.getElementById('retry').addEventListener('click', function () { load(); });
  }

  // ───── render ─────
  function render() {
    var d = data, rd = d.range;
    var presets = [['today', 'Vandaag'], ['7', '7 dagen'], ['30', '30 dagen'], ['90', '90 dagen'], ['365', '12 maanden'], ['custom', 'Kies…']];
    var ignored = false; try { ignored = localStorage.getItem('colleo_stats_ignore') === '1'; } catch (e) {}

    var h = '<header class="top"><div class="brand"><span class="dot"></span>Colleo<small>Statistieken</small></div>' +
      '<span class="live' + (d.live ? ' on' : '') + '" title="Bezoekers in de laatste 5 minuten"><i></i>' + d.live + ' nu actief</span>' +
      '<span class="spacer"></span>' +
      '<div class="ranges" role="group" aria-label="Periode">' + presets.map(function (p) { return '<button data-r="' + p[0] + '" aria-pressed="' + (range.preset === p[0]) + '">' + p[1] + '</button>'; }).join('') + '</div>' +
      '<div class="custom' + (range.preset === 'custom' ? ' show' : '') + '"><input type="date" id="cf" value="' + rd.from + '"> tot <input type="date" id="ct" value="' + rd.to + '"></div>' +
      '<button class="iconbtn" id="refresh" title="Vernieuwen">↻</button></header>';

    h += '<main id="main">';
    if (!d.totals.pv && !d.prev.pv) {
      h += '<div class="notice"><h3>Nog geen bezoeken gemeten</h3><p>Alles staat klaar. Zodra iemand colleo.be bezoekt, verschijnen de cijfers hier (vernieuw even). Je eigen bezoeken tellen niet mee als je onderaan "Mijn bezoeken niet meetellen" aanvinkt.</p></div>';
    }
    h += kpis(d) + '<section class="card"><h2>Bezoekers per dag</h2><p class="sub">' + fmtDay(rd.from, true) + ' – ' + fmtDay(rd.to, true) + '</p><div class="chart" id="daily"></div></section>';
    h += pagesSection(d);
    h += elearningSection(d);
    h += '<div class="sectionhead"><h2>Herkomst</h2><p>Waar bezoekers vandaan komen</p></div>';
    h += '<div class="grid three">' +
      listCard('Websites', 'Bezoekers die via een link binnenkwamen', d.refs, function (k) { return k; }, 'Nog geen verwijzende websites. Rechtstreekse bezoeken en apps (WhatsApp, mail) tellen niet als website.') +
      listCard('Campagnes', 'Links met ?bron=, ?ref= of ?utm_source=', d.sources, function (k) { return k; }, 'Nog geen campagnelinks gebruikt. Tip: deel colleo.be?bron=nieuwsbrief of ?bron=qr.') +
      listCard('Landen', 'Unieke bezoekers', d.countries, country, 'Nog geen gegevens.') + '</div>';
    h += '<div class="grid three" style="margin-top:16px">' +
      listCard('Toestellen', 'Op basis van schermbreedte', d.devices, function (k) { return k; }, 'Nog geen gegevens.') +
      listCard('Browsers', 'Unieke bezoekers', d.browsers, function (k) { return k; }, 'Nog geen gegevens.') +
      '<section class="card"><h2>Tijdstip</h2><p class="sub">Bezoeken per uur van de dag (Belgische tijd)</p><div class="chart" id="hours"></div></section></div>';
    h += '</main>';
    h += '<footer><span>Cookievrij: geen cookies, geen IP-adressen bewaard, bezoekers-ID wisselt elke dag. Gegevens worden na ± 25 maanden gewist.</span>' +
      '<span><label><input type="checkbox" id="ign"' + (ignored ? ' checked' : '') + '> Mijn bezoeken op dit toestel niet meetellen</label> · <a href="#" id="lo" style="color:inherit">Uitloggen</a></span></footer>';
    app.innerHTML = h;

    bind();
    lineChart(document.getElementById('daily'), fillDays(d.daily, rd.from, rd.to));
    hourChart(document.getElementById('hours'), d.hours);
  }

  function delta(cur, prev, invert) {
    if (!prev) return '<span class="delta">geen vergelijking</span>';
    var p = Math.round((cur - prev) / prev * 100);
    var cls = p > 0 ? 'up' : p < 0 ? 'down' : '';
    if (invert) cls = cls === 'up' ? 'down' : cls === 'down' ? 'up' : '';
    return '<span class="delta ' + cls + '">' + (p > 0 ? '▲ +' : p < 0 ? '▼ ' : '') + p + '% <span style="color:var(--faint);font-weight:500">t.o.v. vorige periode</span></span>';
  }
  function kpis(d) {
    var t = d.totals, p = d.prev;
    var avg = t.withdur ? t.dur / t.withdur : 0, pavg = p.withdur ? p.dur / p.withdur : 0;
    var ppv = t.uv ? t.pv / t.uv : 0, pppv = p.uv ? p.pv / p.uv : 0;
    function k(lab, val, dl, sw) { return '<div class="card kpi"><div class="lab">' + (sw ? '<span class="sw" style="background:' + sw + '"></span>' : '') + lab + '</div><div class="val">' + val + '</div>' + dl + '</div>'; }
    return '<div class="grid kpis">' +
      k('Bezoekers', num(t.uv), delta(t.uv, p.uv), 'var(--s2)') +
      k('Paginaweergaven', num(t.pv), delta(t.pv, p.pv), 'var(--s1)') +
      k('Gem. tijd per pagina', dur(avg), delta(avg, pavg)) +
      k('Pagina’s per bezoek', ppv ? ppv.toLocaleString('nl-BE', { maximumFractionDigits: 1 }) : '–', delta(ppv, pppv)) + '</div>';
  }

  function pagesSection(d) {
    var rows = d.pages.map(function (r) { r.avg = r.withdur ? r.dur / r.withdur : 0; return r; });
    var maxAvg = Math.max.apply(null, rows.map(function (r) { return r.avg; }).concat([1]));
    var longest = rows.filter(function (r) { return r.uv >= 2; }).sort(function (a, b) { return b.avg - a.avg; }).slice(0, 3).map(function (r) { return r.path; });
    var key = { uv: 'uv', pv: 'pv', avg: 'avg', scroll: 'scroll', entries: 'entries' }[pageSort];
    rows.sort(function (a, b) { return (b[key] || 0) - (a[key] || 0); });
    function th(k, lab) { return '<th><button data-sort="' + k + '"' + (pageSort === k ? ' aria-sort="descending"' : '') + '>' + lab + '</button></th>'; }
    var body = rows.length ? rows.map(function (r) {
      var w = Math.max(2, Math.round(r.avg / maxAvg * 80));
      return '<tr><td class="page"><div class="p">' + esc(pageName(r.path)) + (longest.indexOf(r.path) >= 0 ? '<span class="badge">langst gelezen</span>' : '') + '</div><div class="u">' + esc(r.path) + '</div></td>' +
        '<td>' + num(r.uv) + '</td><td>' + num(r.pv) + '</td>' +
        '<td><span class="tbar">' + dur(r.avg) + '<span class="track"><span class="b" style="width:' + (r.avg ? w : 0) + 'px"></span></span></span></td>' +
        '<td>' + (r.scroll != null ? r.scroll + '%' : '–') + '</td><td>' + num(r.entries) + '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="empty">Nog geen paginaweergaven in deze periode.</td></tr>';
    return '<div class="sectionhead"><h2>Pagina’s</h2><p>Klik op een kolom om te sorteren</p></div><section class="card"><div class="tablewrap"><table>' +
      '<thead><tr><th>Pagina</th>' + th('uv', 'Bezoekers') + th('pv', 'Weergaven') + th('avg', 'Gem. tijd') + th('scroll', 'Gescrold') + th('entries', 'Binnenkomst') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="sub" style="margin:12px 0 0">Gem. tijd = actieve tijd (tabblad zichtbaar). Gescrold = hoe ver men gemiddeld naar beneden scrolde. Binnenkomst = hoe vaak dit de eerste pagina van een bezoek was.</p></section>';
  }

  function elearningSection(d) {
    var mods = {};
    d.screens.forEach(function (s) { (mods[s.path] = mods[s.path] || { screens: [], ev: [] }).screens.push(s); });
    d.events.forEach(function (e) { if (mods[e.path] || /^\/elearning/.test(e.path)) (mods[e.path] = mods[e.path] || { screens: [], ev: [] }).ev.push(e); });
    var keys = Object.keys(mods);
    var h = '<div class="sectionhead"><h2>E-learnings</h2><p>Per scherm: hoeveel deelnemers er kwamen en hoe lang ze bleven</p></div>';
    if (!keys.length) return h + '<section class="card"><p class="empty">Nog geen e-learningbezoeken in deze periode.</p></section>';
    keys.forEach(function (path) {
      var m = mods[path], sc = m.screens.sort(function (a, b) { return a.i - b.i; });
      var start = sc.length ? Math.max.apply(null, sc.map(function (s) { return s.uv; })) : 0;
      var toetsScr = sc.filter(function (s) { return s.type === 'toets'; })[0];
      var evOf = function (n, l) { return m.ev.filter(function (e) { return e.name === n && (l == null || e.label === l); }); };
      var pass = evOf('toets', 'geslaagd'), fail = evOf('toets', 'niet geslaagd');
      var passN = pass.reduce(function (a, e) { return a + e.uv; }, 0);
      var attempts = pass.concat(fail).reduce(function (a, e) { return a + e.n; }, 0);
      var avgScore = pass.length ? pass[0].avg : null;
      var videos = evOf('video').reduce(function (a, e) { return a + e.n; }, 0);
      var fb = evOf('feedback').reduce(function (a, e) { return a + e.uv; }, 0);
      var totalTime = sc.reduce(function (a, s) { return a + (s.dur || 0); }, 0);
      var maxAvg = 1, times = sc.map(function (s) { var a = s.withdur ? s.dur / s.withdur : 0; if (a > maxAvg) maxAvg = a; return a; });
      var topTimes = times.slice().sort(function (a, b) { return b - a; }).slice(0, 3).filter(function (x) { return x > 0; });

      h += '<section class="card mod"><div class="modhead"><h2>' + esc(pageName(path)) + '</h2><span class="sub" style="margin:0">' + esc(path) + '</span></div>';
      h += '<div class="modstats">' +
        ms('Gestart', num(start), 'deelnemers') +
        ms('Tot aan eindtoets', toetsScr ? num(toetsScr.uv) : '–', start && toetsScr ? Math.round(toetsScr.uv / start * 100) + '%' : '') +
        ms('Geslaagd', num(passN), attempts ? attempts + ' pogingen' : '') +
        ms('Gem. score geslaagden', avgScore != null ? avgScore + '%' : '–', '') +
        ms(fb ? 'Feedback gegeven' : 'Totale leertijd', fb ? num(fb) : dur(totalTime), videos ? videos + ' video’s gestart' : '') + '</div>';
      if (sc.length) {
        var rowsHtml = sc.map(function (s, idx) {
          var pct = start ? Math.round(s.uv / start * 100) : 0;
          var a = times[idx];
          var hot = a > 0 && topTimes.indexOf(a) >= 0;
          return '<tr><td class="page"><span class="typ">' + esc(TYPES[s.type] || s.type || '') + '</span>' + (s.i + 1) + '. ' + esc(s.title || '') + (hot ? '<span class="badge">langst</span>' : '') + '</td>' +
            '<td><span class="funnel">' + num(s.uv) + '<span class="track"><span class="b" style="width:' + pct + '%"></span></span><span style="width:36px;color:var(--faint)">' + pct + '%</span></span></td>' +
            '<td><span class="tbar">' + dur(a) + '<span class="track"><span class="b" style="width:' + (a ? Math.max(2, Math.round(a / maxAvg * 80)) : 0) + 'px"></span></span></span></td></tr>';
        }).join('');
        var table = function (body) { return '<div class="tablewrap"><table class="screens"><thead><tr><th>Scherm</th><th>Bereikt</th><th>Gem. tijd</th></tr></thead><tbody>' + body + '</tbody></table></div>'; };
        h += table(rowsHtml);
        h += '<p class="sub" style="margin:12px 0 0">“Bereikt” daalt naarmate deelnemers afhaken. Een scherm met een sterke daling of uitzonderlijk lange tijd is een goede kandidaat om te herwerken. Deelnemers die over meerdere dagen werken tellen per dag.</p>';
      }
      h += '</section>';
    });
    return h;
  }
  function ms(l, v, s) { return '<div class="ms"><div class="l">' + l + '</div><div class="v">' + v + (s ? '<small>' + s + '</small>' : '') + '</div></div>'; }

  function listCard(title, sub, rows, label, emptyMsg) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
    var body = rows.length ? '<ul class="blist">' + rows.map(function (r) {
      return '<li title="' + esc(label(r.k)) + ': ' + num(r.n) + '"><span class="fill" style="width:' + Math.max(3, r.n / max * 100) + '%"></span><span class="k">' + esc(label(r.k)) + '</span><span class="n">' + num(r.n) + '</span></li>';
    }).join('') + '</ul>' : '<p class="empty">' + emptyMsg + '</p>';
    return '<section class="card"><h2>' + title + '</h2><p class="sub">' + sub + '</p>' + body + '</section>';
  }

  function bind() {
    app.querySelectorAll('.ranges button').forEach(function (b) {
      b.addEventListener('click', function () {
        range.preset = b.dataset.r;
        if (range.preset === 'custom') { var rd = data.range; range.from = rd.from; range.to = rd.to; }
        saveRange(); load();
      });
    });
    ['cf', 'ct'].forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      el.addEventListener('change', function () { range.preset = 'custom'; range.from = document.getElementById('cf').value; range.to = document.getElementById('ct').value; if (range.from && range.to) { saveRange(); load(); } });
    });
    document.getElementById('refresh').addEventListener('click', function () { load(); });
    app.querySelectorAll('th button[data-sort]').forEach(function (b) { b.addEventListener('click', function () { pageSort = b.dataset.sort; render(); }); });
    document.getElementById('lo').addEventListener('click', function (e) { e.preventDefault(); logout(); });
    document.getElementById('ign').addEventListener('change', function (e) { try { if (e.target.checked) localStorage.setItem('colleo_stats_ignore', '1'); else localStorage.removeItem('colleo_stats_ignore'); } catch (er) {} });
  }
  function saveRange() { try { sessionStorage.setItem('colleo_stats_range', JSON.stringify(range)); } catch (e) {} }

  // ───── grafieken ─────
  function fillDays(rows, from, to) {
    var map = {}; rows.forEach(function (r) { map[r.day] = r; });
    var out = [];
    for (var d = from; d <= to; d = addDays(d, 1)) out.push({ day: d, pv: map[d] ? map[d].pv : 0, uv: map[d] ? map[d].uv : 0 });
    return out;
  }
  function niceMax(v) { if (v <= 4) return 4; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function lineChart(el, pts) {
    var W = el.clientWidth && el.clientWidth < 640 ? 560 : 1100, H = 280, L = 44, R = 12, T = 14, B = 30;
    var max = niceMax(Math.max.apply(null, pts.map(function (p) { return p.pv; }).concat([1])));
    var n = pts.length, iw = W - L - R, ih = H - T - B;
    var x = function (i) { return L + (n === 1 ? iw / 2 : i / (n - 1) * iw); };
    var y = function (v) { return T + ih - v / max * ih; };
    var g = '';
    for (var k = 0; k <= 4; k++) { var v = max / 4 * k, yy = y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--grid)"/><text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="12" fill="var(--faint)">' + num(v) + '</text>'; }
    var step = Math.max(1, Math.ceil(n / (W < 700 ? 4 : 8)));
    pts.forEach(function (p, i) { if (i % step === 0 || i === n - 1 && n < 9) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" fill="var(--faint)">' + fmtDay(p.day) + '</text>'; });
    function path(key) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[key]).toFixed(1); }).join(' '); }
    var area = path('uv') + ' L' + x(n - 1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z';
    g += '<path d="' + area + '" fill="var(--s2)" opacity=".08"/>';
    g += '<path d="' + path('pv') + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    g += '<path d="' + path('uv') + '" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if (n <= 45) pts.forEach(function (p, i) { g += '<circle cx="' + x(i) + '" cy="' + y(p.uv) + '" r="3" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>'; });
    g += '<line id="xh" y1="' + T + '" y2="' + (T + ih) + '" stroke="var(--faint)" stroke-dasharray="3 3" opacity="0"/>';
    g += '<circle id="d1" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" opacity="0"/><circle id="d2" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2" opacity="0"/>';
    g += '<rect x="' + L + '" y="' + T + '" width="' + iw + '" height="' + ih + '" fill="transparent" id="hit"/>';
    el.innerHTML = '<div class="legend"><span><i style="background:var(--s2)"></i>Bezoekers</span><span><i style="background:var(--s1)"></i>Paginaweergaven</span></div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bezoekers en paginaweergaven per dag">' + g + '</svg><div class="tip" id="tip1"></div>' +
      '<table class="sr"><caption>Bezoekers per dag</caption><tr><th>Dag</th><th>Bezoekers</th><th>Weergaven</th></tr>' + pts.map(function (p) { return '<tr><td>' + p.day + '</td><td>' + p.uv + '</td><td>' + p.pv + '</td></tr>'; }).join('') + '</table>';
    var svg = el.querySelector('svg'), tip = el.querySelector('#tip1'), xh = svg.querySelector('#xh'), d1 = svg.querySelector('#d1'), d2 = svg.querySelector('#d2');
    function move(ev) {
      var rc = svg.getBoundingClientRect(), sx = (ev.clientX - rc.left) / rc.width * W;
      var i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((sx - L) / iw * (n - 1)))), p = pts[i];
      xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', 1);
      d1.setAttribute('cx', x(i)); d1.setAttribute('cy', y(p.pv)); d1.setAttribute('opacity', 1);
      d2.setAttribute('cx', x(i)); d2.setAttribute('cy', y(p.uv)); d2.setAttribute('opacity', 1);
      tip.innerHTML = '<b>' + fmtDay(p.day, true) + '</b><div class="row"><i style="background:' + cssVar('--s2') + '"></i>' + num(p.uv) + ' bezoekers</div><div class="row"><i style="background:' + cssVar('--s1') + '"></i>' + num(p.pv) + ' weergaven</div>';
      var px = x(i) / W * rc.width, py = y(p.pv) / H * rc.height + 28;
      tip.style.left = Math.max(70, Math.min(rc.width - 70, px)) + 'px'; tip.style.top = py + 'px'; tip.classList.add('show');
    }
    function out() { tip.classList.remove('show'); [xh, d1, d2].forEach(function (e) { e.setAttribute('opacity', 0); }); }
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerleave', out);
  }

  function hourChart(el, stamps) {
    var counts = new Array(24).fill(0);
    var fmt = new Intl.DateTimeFormat('nl-BE', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Europe/Brussels' });
    stamps.forEach(function (t) { counts[parseInt(fmt.format(new Date(t)), 10) % 24]++; });
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    if (!total) { el.innerHTML = '<p class="empty">Nog geen gegevens.</p>'; return; }
    var W = 360, H = 170, L = 4, B = 22, T = 8, max = Math.max.apply(null, counts), bw = (W - L * 2) / 24, ih = H - B - T;
    var g = '<line x1="0" x2="' + W + '" y1="' + (T + ih) + '" y2="' + (T + ih) + '" stroke="var(--hairline)"/>';
    counts.forEach(function (c, h) {
      var bh = c ? Math.max(3, c / max * ih) : 0, xx = L + h * bw + 1, yy = T + ih - bh;
      if (bh) g += '<path d="M' + xx + ' ' + (T + ih) + ' V' + (yy + 3) + ' q0 -3 3 -3 h' + (bw - 8) + ' q3 0 3 3 V' + (T + ih) + ' Z" fill="var(--bar)"/>';
      g += '<rect x="' + (L + h * bw) + '" y="' + T + '" width="' + bw + '" height="' + ih + '" fill="transparent" data-h="' + h + '"/>';
      if (h % 6 === 0) g += '<text x="' + (L + h * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--faint)">' + h + 'u</text>';
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bezoeken per uur">' + g + '</svg><div class="tip" id="tip2"></div>';
    var svg = el.querySelector('svg'), tip = el.querySelector('#tip2');
    svg.addEventListener('pointermove', function (ev) {
      var hh = ev.target.getAttribute && ev.target.getAttribute('data-h'); if (hh == null) return;
      var rc = svg.getBoundingClientRect(), h = +hh;
      tip.innerHTML = '<b>' + h + 'u – ' + (h + 1) + 'u</b><br>' + counts[h] + ' bezoeken (' + Math.round(counts[h] / total * 100) + '%)';
      tip.style.left = Math.max(60, Math.min(rc.width - 60, (L + h * bw + bw / 2) / W * rc.width)) + 'px';
      tip.style.top = ((T + ih - (counts[h] / max * ih)) / H * rc.height) + 'px'; tip.classList.add('show');
    });
    svg.addEventListener('pointerleave', function () { tip.classList.remove('show'); });
  }

  load(true);
})();
</script>
</body>
</html>
