<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colleo — Bijscholing voor kinesitherapeuten</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>/* ===== Colleo — design system ===== */
:root {
  /* Brand */
  --navy: #1e2d4a;          /* primary (tweakable) */
  --accent: #3ecfb2;        /* accent (tweakable) */
  --accent-ink: #0f5e50;    /* readable text-on-light derived from accent */

  /* Warm neutrals */
  --bg: #f7f3ec;
  --bg-2: #efe9df;
  --surface: #ffffff;
  --ink: #1b2436;
  --muted: #5b6577;
  --hairline: rgba(30, 45, 74, 0.12);
  --hairline-soft: rgba(30, 45, 74, 0.07);

  /* Type */
  --font-display: "Bricolage Grotesque", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;

  /* Shape */
  --r-card: 22px;
  --r-pill: 999px;
  --r-sm: 12px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(27, 36, 54, 0.04), 0 2px 8px rgba(27, 36, 54, 0.05);
  --shadow-md: 0 12px 30px -12px rgba(27, 36, 54, 0.22);
  --shadow-lg: 0 30px 70px -30px rgba(27, 36, 54, 0.40);

  /* Layout */
  --maxw: 1180px;
  --gutter: clamp(20px, 5vw, 64px);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 92px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.04;
  margin: 0;
  color: var(--navy);
  text-wrap: balance;
}
p { margin: 0; text-wrap: pretty; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(64px, 9vw, 130px); }

/* eyebrow */
.eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--accent-ink);
}
.eyebrow::before {
  content: ""; width: 22px; height: 2px; border-radius: 2px;
  background: var(--accent);
}
.eyebrow.center::after {
  content: ""; width: 22px; height: 2px; border-radius: 2px; background: var(--accent);
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: none; border-radius: var(--r-pill);
  padding: 16px 26px; font-size: 1.02rem; font-weight: 600;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-md); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-accent { background: var(--accent); color: var(--navy); box-shadow: var(--shadow-md); }
.btn-accent:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-ghost {
  background: transparent; color: var(--navy);
  border: 1.5px solid var(--hairline); padding: 14.5px 24px;
}
.btn-ghost:hover { border-color: var(--navy); background: rgba(30,45,74,0.04); }
.btn-block { width: 100%; }
.btn .arr { transition: transform .16s ease; }
.btn:hover .arr { transform: translateX(3px); }

/* nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, background .2s ease;
}
.nav.scrolled { border-color: var(--hairline-soft); background: color-mix(in srgb, var(--bg) 92%, transparent); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
.brand { display: flex; align-items: center; gap: 11px; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--navy); letter-spacing: -0.03em; }
.brand .dot { width: 30px; height: 30px; border-radius: 9px; background: var(--navy); display: grid; place-items: center; color: var(--accent); font-size: 1.05rem; }
.nav-links { display: flex; align-items: center; gap: 34px; }
.nav-links a { font-weight: 500; color: var(--muted); font-size: 0.98rem; transition: color .15s; }
.nav-links a:hover { color: var(--navy); }
.nav-cta { display: flex; align-items: center; gap: 16px; }
.nav-login { font-weight: 600; font-size: 0.96rem; color: var(--navy); padding: 8px 4px; }
.nav-login:hover { color: var(--accent-ink); }
@media (max-width: 520px) { .nav-login { display: none; } }
@media (max-width: 860px) { .nav-links { display: none; } }

/* hero */
.hero { position: relative; overflow: hidden; }
.hero-grid {
  display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(32px, 5vw, 72px);
  align-items: center; padding-top: clamp(48px, 7vw, 90px); padding-bottom: clamp(56px, 8vw, 110px);
}
.hero h1 { font-size: clamp(2.7rem, 5.6vw, 4.5rem); }
.hero h1 .hl { color: var(--accent-ink); position: relative; white-space: nowrap; }
.hero .lede { margin-top: 26px; font-size: clamp(1.08rem, 1.6vw, 1.28rem); color: var(--muted); max-width: 33ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
.hero-note { margin-top: 18px; font-size: 0.92rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.hero-note .check { color: var(--accent-ink); }

/* hero visual */
.hero-visual { position: relative; }
.premie-card {
  background: var(--navy); color: #fff; border-radius: var(--r-card);
  padding: 30px 30px 26px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.premie-card::after {
  content: ""; position: absolute; inset: auto -40px -60px auto; width: 200px; height: 200px;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%);
}
.premie-card .lbl { font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; color: color-mix(in srgb, #fff 70%, transparent); }
.premie-card .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 5vw, 3.4rem); line-height: 1; margin-top: 8px; }
.premie-card .big small { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
.premie-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.16); position: relative; z-index: 1; }
.premie-row .col .k { font-size: 0.8rem; color: color-mix(in srgb, #fff 65%, transparent); }
.premie-row .col .v { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin-top: 3px; }
.premie-row .col .v.pos { color: var(--accent); }

.float-card {
  position: absolute; left: -28px; bottom: -58px; background: var(--surface);
  border-radius: 16px; box-shadow: var(--shadow-md); padding: 15px 18px;
  display: flex; align-items: center; gap: 13px; max-width: 240px;
}
.float-card .ic { width: 40px; height: 40px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.float-card .t { font-weight: 700; font-size: 0.95rem; color: var(--navy); }
.float-card .s { font-size: 0.82rem; color: var(--muted); }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-visual { margin-top: 22px; }
  .float-card { position: static; margin: 16px 0 0; max-width: none; width: fit-content; }
}

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hairline-soft); border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--hairline-soft); margin-top: 8px; }
.stat { background: var(--bg); padding: 26px 22px; text-align: center; }
.stat .num { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 3vw, 2.5rem); color: var(--navy); line-height: 1; }
.stat .num em { font-style: normal; color: var(--accent-ink); }
.stat .cap { font-size: 0.88rem; color: var(--muted); margin-top: 8px; }
@media (max-width: 680px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* generic section header */
.sec-head { max-width: 640px; margin-bottom: clamp(36px, 5vw, 60px); }
.sec-head.center { margin-inline: auto; text-align: center; }
.sec-head h2 { font-size: clamp(2rem, 3.8vw, 3rem); margin-top: 16px; }
.sec-head p { margin-top: 18px; font-size: 1.12rem; color: var(--muted); }

/* why cards */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.card {
  background: var(--surface); border-radius: var(--r-card); padding: 32px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--hairline-soft);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.card .ic { width: 52px; height: 52px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 20%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; margin-bottom: 20px; }
.card h3 { font-size: 1.4rem; }
.card p { margin-top: 11px; color: var(--muted); font-size: 1rem; }
@media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }

/* programma */
.prog { background: var(--bg-2); }
.prog-list { display: flex; flex-direction: column; gap: 14px; }
.prog-row {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 26px; align-items: center;
  background: var(--surface); border-radius: 18px; padding: 24px 28px;
  border: 1px solid var(--hairline-soft); box-shadow: var(--shadow-sm);
  transition: transform .16s ease, box-shadow .16s ease;
}
.prog-row:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.prog-row .idx { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; color: var(--accent-ink); }
.prog-row .body .topic { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--navy); }
.prog-row .body .desc { color: var(--muted); margin-top: 4px; font-size: 0.98rem; }
.prog-row .meta { text-align: right; }
.prog-row .meta .date { font-weight: 700; color: var(--navy); white-space: nowrap; }
.prog-row .meta .ne { font-size: 0.85rem; color: var(--accent-ink); font-weight: 600; margin-top: 3px; }
@media (max-width: 720px) {
  .prog-row { grid-template-columns: 50px 1fr; }
  .prog-row .meta { grid-column: 1 / -1; text-align: left; padding-top: 12px; border-top: 1px solid var(--hairline-soft); display: flex; gap: 16px; align-items: baseline; }
  .prog-row .meta .ne { margin-top: 0; }
}

/* voordeel */
.voordeel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(34px, 5vw, 70px); align-items: center; }
.calc { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-md); border: 1px solid var(--hairline-soft); padding: clamp(28px, 4vw, 42px); }
.calc-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--hairline-soft); }
.calc-row:first-of-type { padding-top: 0; }
.calc-row .lbl { color: var(--muted); font-size: 1rem; }
.calc-row .lbl b { display: block; color: var(--ink); font-weight: 600; font-size: 1.08rem; }
.calc-row .amt { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--navy); white-space: nowrap; }
.calc-row .amt.cost { color: var(--muted); }
.calc-row .amt.cost::before { content: "−"; margin-right: 2px; }
.calc-row .amt.gain { color: var(--accent-ink); }
.calc-row .amt.gain::before { content: "+"; margin-right: 1px; }
.calc-total { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 22px 24px; background: var(--navy); color: #fff; border-radius: 16px; }
.calc-total .lbl { font-weight: 600; font-size: 1.05rem; }
.calc-total .amt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 3.5vw, 2.5rem); color: var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 22px; height: 220px; margin-top: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 12px 12px 0 0; position: relative; transition: height .6s cubic-bezier(.2,.7,.2,1); }
.bar.cost { background: var(--bg-2); border: 1px solid var(--hairline); }
.bar.gain { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 75%, var(--navy))); }
.bar-col .cap { font-size: 0.9rem; color: var(--muted); text-align: center; }
.bar-col .cap b { display: block; color: var(--navy); font-family: var(--font-display); font-size: 1.15rem; }
@media (max-width: 860px) { .voordeel-grid { grid-template-columns: 1fr; } }

/* aanpak steps */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: step; }
.step { position: relative; }
.step .n { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--hairline); color: var(--navy); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.step h3 { font-size: 1.22rem; }
.step p { color: var(--muted); margin-top: 8px; font-size: 0.98rem; }
.step:not(:last-child) .n::after { content: ""; position: absolute; left: 46px; top: 23px; width: calc(100% - 46px - 20px); height: 1.5px; background: var(--hairline); }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } .step .n::after { display: none; } }
@media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }

/* merged aanpak + voordeel */
.merge-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(34px, 5vw, 70px); align-items: start; }
@media (max-width: 880px) { .merge-grid { grid-template-columns: 1fr; } }
.steps-vert { display: flex; flex-direction: column; }
.vstep { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 20px; padding-bottom: 30px; }
.vstep:last-child { padding-bottom: 0; }
.vstep .n { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--hairline); color: var(--navy); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: grid; place-items: center; box-shadow: var(--shadow-sm); z-index: 1; }
.vstep:not(:last-child)::before { content: ""; position: absolute; left: 23.5px; top: 48px; bottom: 6px; width: 1.5px; background: var(--hairline); }
.vstep .vbody h3 { font-size: 1.22rem; }
.vstep .vbody p { color: var(--muted); margin-top: 5px; font-size: 0.99rem; }
.calc-extras { display: grid; gap: 14px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--hairline-soft); }
.calc-extra { display: flex; gap: 13px; align-items: flex-start; }
.calc-extra .ce-ic { width: 40px; height: 40px; flex: none; border-radius: 11px; background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent-ink); display: grid; place-items: center; }
.calc-extra .ce-t { font-weight: 700; color: var(--navy); font-size: 1rem; }
.calc-extra .ce-s { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

/* e-learnings */
.el-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 880px) { .el-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 580px) { .el-grid { grid-template-columns: 1fr; } }
.el-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--hairline-soft); border-radius: var(--r-card); padding: 26px; box-shadow: var(--shadow-sm); transition: transform .18s ease, box-shadow .18s ease; color: inherit; }
.el-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.el-more { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; color: var(--accent-ink); font-weight: 600; font-size: 0.92rem; }
.el-more svg { transition: transform .16s ease; }
.el-card:hover .el-more svg { transform: translateX(4px); }
.el-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.el-badge { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); padding: 5px 11px; border-radius: 999px; }
.el-pts { font-size: 0.82rem; font-weight: 600; color: var(--navy); }
.el-card h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.el-card p { color: var(--muted); margin-top: 10px; font-size: 0.98rem; flex: 1; }
.el-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hairline-soft); }
.el-meta { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 0.92rem; }
.el-price { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--navy); text-align: right; line-height: 1; }
.el-price small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.el-note { text-align: center; margin-top: 30px; color: var(--muted); font-size: 1rem; }
.el-note a { color: var(--accent-ink); font-weight: 600; }

/* final cta */
.cta-band { background: var(--navy); color: #fff; border-radius: clamp(22px, 4vw, 36px); padding: clamp(44px, 7vw, 84px) clamp(28px, 6vw, 80px); text-align: center; position: relative; overflow: hidden; }
.cta-band::before { content: ""; position: absolute; inset: -50% 30% auto -20%; height: 400px; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 40%, transparent), transparent 65%); pointer-events: none; }
.cta-band h2 { color: #fff; font-size: clamp(2.1rem, 4.5vw, 3.4rem); position: relative; }
.cta-band p { color: color-mix(in srgb, #fff 78%, transparent); font-size: 1.15rem; margin-top: 18px; max-width: 52ch; margin-inline: auto; position: relative; }
.cta-band .hero-cta { justify-content: center; position: relative; }
.cta-band .hero-note { justify-content: center; color: color-mix(in srgb, #fff 70%, transparent); }
.cta-band .hero-note .check { color: var(--accent); }

/* footer */
.footer { padding-block: 54px; border-top: 1px solid var(--hairline); }
.footer-inner { display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; }
.footer .muted { color: var(--muted); font-size: 0.92rem; }
.footer-links { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.footer-links a { color: var(--muted); font-size: 0.94rem; }
.footer-links a:hover { color: var(--navy); }

/* reveal on scroll */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(20,28,46,0.55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--surface); border-radius: var(--r-card); width: min(480px, 100%);
  box-shadow: var(--shadow-lg); padding: clamp(26px, 4vw, 40px); position: relative; animation: pop .25s cubic-bezier(.2,.8,.2,1);
  max-height: calc(100vh - 40px); overflow: auto;
}
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.modal .close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-2); color: var(--ink); display: grid; place-items: center; }
.modal .close:hover { background: var(--hairline); }
.modal h3 { font-size: 1.7rem; }
.modal .sub { color: var(--muted); margin-top: 8px; }
.field { margin-top: 18px; }
.field label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 7px; color: var(--ink); }
.field input {
  width: 100%; padding: 13px 15px; border-radius: var(--r-sm); border: 1.5px solid var(--hairline);
  font-family: inherit; font-size: 1rem; background: var(--bg); color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.modal .summary { margin-top: 18px; background: var(--bg-2); border-radius: var(--r-sm); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
.modal .summary .k { color: var(--muted); font-size: 0.92rem; }
